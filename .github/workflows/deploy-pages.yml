name: Deploy to GitHub Pages

# 이 브랜치에 푸시될 때마다(주간 자동 갱신 포함) 정적 사이트를 GitHub Pages로 배포한다.
on:
  push:
    branches:
      - claude/stock-analysis-recommendation-v9310x
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록 하되, 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 정적 파일이 저장소 루트에 있으므로 루트 전체를 업로드한다.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

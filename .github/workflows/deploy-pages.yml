name: Deploy to GitHub Pages

# 이 브랜치에 푸시될 때마다(주간 자동 갱신 포함) 정적 사이트를 GitHub Pages로 배포한다.
on:
  push:
    branches:
      - claude/stock-analysis-recommendation-v9310x
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 여러 푸시가 몰릴 때 진행 중인 배포를 취소하고 최신 것만 배포한다.
# (같은 run 을 재시도하면 아티팩트가 누적돼 "Multiple artifacts" 오류가 나므로,
#  재시도 대신 항상 새 커밋/새 run 으로 배포하는 것을 전제로 한다.)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 빌드(아티팩트 업로드)와 배포를 분리 — GitHub 공식 권장 패턴.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 신뢰도 게이트 — 검증 실패 데이터는 Pages 에 배포되지 않는다
      - name: Validate data (guardrail)
        run: node scripts/validate-reco.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 정적 파일이 저장소 루트에 있으므로 루트 전체를 업로드한다.
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      # GitHub Pages 백엔드 일시 장애("Deployment failed, try again later.") 대비 자동 재시도.
      # 아티팩트는 build 잡에서 이미 1회만 업로드했으므로 배포만 재시도 — 충돌 없음.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      # 마지막 시도는 continue-on-error 없이 — 3회 모두 실패하면 잡을 실패로 남겨 문제를 드러낸다.
      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4

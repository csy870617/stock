name: Reevaluate recommendations (daily, LLM)

# 매일 종목을 재평가해 "더 나은 종목"으로 교체한다(LLM + 웹 검색):
#   1) reeval-reco.js  → Anthropic API(claude-opus-4-8)로 update-reco 형식 패치 생성
#   2) update-reco.js  → 패치를 recommendations.js 에 적용(바뀐 종목만 merge/add/remove)
#   3) update-quotes.js→ (새 티커 포함) 시세를 quotes.js 로 갱신
#   4) daily-maintenance.js → generatedAt(오늘) + 지수·스냅샷(history.js) 축적
# 커밋되면 마지막 스텝이 deploy-pages 를 트리거해 페이지를 재배포한다.
#
# 필수: 저장소 Secret 에 ANTHROPIC_API_KEY 를 추가해야 동작한다
#       (Settings → Secrets and variables → Actions → New repository secret).
#
# 참고: 시세만 갱신하는 refresh-quotes.yml 과 공존한다(그쪽은 토큰 0, 하루 2회).
#       예약(cron)은 이 워크플로우가 "기본 브랜치"에 있어야 동작한다(GitHub 정책).
on:
  schedule:
    - cron: "30 7 * * 1-5"    # 평일 07:30 UTC ≈ 한국 장 마감 이후(가격 갱신 이후에 재평가)
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # deploy-pages 를 workflow_dispatch 로 트리거하기 위해 필요

concurrency:
  group: reeval-reco
  cancel-in-progress: false

env:
  TARGET_BRANCH: claude/stock-analysis-recommendation-v9310x   # 배포(=기본) 브랜치

jobs:
  reeval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Anthropic SDK
        run: npm install --no-save @anthropic-ai/sdk

      - name: Reevaluate → patch (LLM + web search)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/reeval-reco.js --out reco-patch.json

      - name: Apply patch to recommendations.js
        run: node scripts/update-reco.js reco-patch.json

      - name: Update quotes (new tickers → data/quotes.js)
        run: node scripts/update-quotes.js

      - name: Daily maintenance (generatedAt + 지수·스냅샷)
        run: node scripts/daily-maintenance.js

      - name: Commit & push if changed
        id: commit
        run: |
          rm -f reco-patch.json
          if git diff --quiet -- data/quotes.js data/recommendations.js data/history.js; then
            echo "변화 없음 — 커밋 생략"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.js data/recommendations.js data/history.js
          git commit -m "매일 종목 재평가 (자동, LLM) — 편입·편출·목표가·시세 갱신"
          git push origin HEAD:${TARGET_BRANCH}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 푸시는 push 트리거를 안 태우므로, 바뀌었을 때만 배포를 명시적으로 건다.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "${TARGET_BRANCH}"

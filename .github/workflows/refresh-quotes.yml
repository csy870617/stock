name: Refresh quotes (daily, token-free)

# 매일 앱 최신성을 순수 스크립트로 보장한다(LLM 토큰 0):
#   1) update-quotes.js  → data/quotes.js (실제 Yahoo 시세)
#   1-2) update-consensus.js → data/consensus.js + recommendations.js targetPrice (네이버 컨센서스)
#   2) update-indices.js → data/indices.js (지수 단기/장기 이동평균·RSI·추세·지지/저항·신호)
#   3) update-stock-ta.js → data/stock-ta.js (개별 종목 단기/장기 기술적 분석)
#   4) update-liquidity-gauge.js → data/liquidity-auto.js (시장지표 기반 유동성 게이지 baseline)
#   5) screen-watch.js → data/watch-candidates.js (관심종목 차트 후보: 턴어라운드·신고가 + 기존 태그 유효성)
#   (월) gen-tickers.js → data/tickers.js (관심종목 검색 사전, 주 1회)
#   6) daily-maintenance.js → recommendations.js generatedAt(오늘) + 지수·스냅샷(history.js)
# 이렇게 하면 LLM 추천 Routine이 실패해도 앱은 매일 오늘자 날짜·시세·지수 기술적 분석·유동성 baseline·스냅샷을 유지한다.
# (종목별 심층 분석·발굴, 유동성 '이벤트·내러티브 판단'은 온디맨드로 남아 baseline 을 보정한다.)
# 바뀌어 커밋되면 마지막 스텝이 deploy-pages 를 직접 트리거해 페이지를 재배포한다.
#
# 왜 직접 트리거하나: GITHUB_TOKEN 으로 만든 푸시는 deploy-pages 의 push 트리거를 태우지
#       않는다(무한 루프 방지 정책). 그래서 workflow_dispatch 로 명시적으로 배포를 건다.
#
# 참고: 예약(cron)·수동(dispatch) 실행은 이 워크플로우가 "기본 브랜치"에 존재해야 동작한다
#       (GitHub 정책). 이 저장소의 기본 브랜치는 아래 TARGET_BRANCH 와 같으므로 병합하면 동작한다.
on:
  schedule:
    - cron: "0 7 * * 1-5"    # 평일 07:00 UTC ≈ 한국 장 마감 이후
    - cron: "0 21 * * 1-5"   # 평일 21:00 UTC ≈ 미국 장 마감 이후
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # deploy-pages 를 workflow_dispatch 로 트리거하기 위해 필요

concurrency:
  group: refresh-quotes
  cancel-in-progress: false

env:
  TARGET_BRANCH: claude/stock-analysis-recommendation-v9310x   # 배포(=기본) 브랜치

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 데이터 스텝은 continue-on-error — 한 스크립트가 야후 장애 등으로 죽어도 나머지가
      # 만든 갱신분은 살려서 커밋한다(스크립트 내부 폴백이 이전 값을 유지하므로 부분 갱신이 안전).
      # 정합성은 마지막 validate 스텝이 하드 게이트로 보증한다.
      - name: Update quotes (Yahoo → data/quotes.js)
        run: node scripts/update-quotes.js
        continue-on-error: true

      # 컨센서스 목표가(네이버 증권 — 한국 FnGuide·미국 LSEG 집계) → data/consensus.js + recommendations.js targetPrice.
      # 기준일 30일 초과·±50% 초과 변화는 반영하지 않고 표시/경고만 남긴다(세션이 웹 검색으로 확인).
      - name: Update consensus targets (Naver → targetPrice, token-free)
        run: node scripts/update-consensus.js
        continue-on-error: true

      - name: Update index technicals (Yahoo → data/indices.js, token-free)
        run: node scripts/update-indices.js
        continue-on-error: true

      - name: Update stock technicals (Yahoo → data/stock-ta.js, token-free)
        run: node scripts/update-stock-ta.js
        continue-on-error: true

      - name: Update liquidity gauge baseline (Yahoo → data/liquidity-auto.js, token-free)
        run: node scripts/update-liquidity-gauge.js
        continue-on-error: true

      # 관심종목 차트 후보(턴어라운드·신고가) + 기존 관심종목 태그 유효성 — LLM 루틴이 읽어 리서치·편입
      - name: Screen watch candidates (Yahoo → data/watch-candidates.js, token-free)
        run: node scripts/screen-watch.js
        continue-on-error: true

      # 관심종목 검색 사전(이름→코드) — 신규 상장 반영용, 월요일 아침 실행에서만 주 1회.
      # KRX 가 막히면 네이버로 폴백하고, 둘 다 실패한 국가는 기존 값을 유지한다(스크립트 내부 처리).
      - name: Refresh ticker dictionary (weekly, → data/tickers.js, token-free)
        if: github.event.schedule == '0 7 * * 1-5'
        run: if [ "$(date -u +%u)" = "1" ]; then node scripts/gen-tickers.js; else echo "월요일만 실행 — 건너뜀"; fi
        continue-on-error: true

      - name: Daily maintenance (generatedAt + 지수·스냅샷, token-free)
        run: node scripts/daily-maintenance.js
        continue-on-error: true

      # 앱 상단 '데이터 신선도' 패널이 읽는 상태 파일 — 매일·회전 항목의 커버리지를 기록한다.
      # coverage.js 는 미완료 시 exit 1 이지만 --emit 은 '게이트'가 아니라 '보고'라 항상 exit 0 이다.
      - name: Emit coverage status (→ data/coverage-status.js, token-free)
        run: node scripts/coverage.js --emit
        continue-on-error: true

      # 신뢰도 게이트 — 구조·형식·계산 정합성이 깨진 데이터는 커밋하지 않는다
      - name: Validate data (guardrail)
        run: node scripts/validate-reco.js

      - name: Commit & push if changed
        id: commit
        run: |
          if git diff --quiet -- data/quotes.js data/recommendations.js data/history.js data/tp-history.json data/indices.js data/stock-ta.js data/liquidity-auto.js data/watch-candidates.js data/coverage-status.js data/tickers.js data/consensus.js data/reco-ops.json; then
            echo "변화 없음 — 커밋 생략"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.js data/recommendations.js data/history.js data/tp-history.json data/indices.js data/stock-ta.js data/liquidity-auto.js data/watch-candidates.js data/coverage-status.js data/tickers.js data/consensus.js data/reco-ops.json
          git commit -m "매일 데이터 갱신 (자동) — 시세·기준일·스냅샷 (update-quotes + daily-maintenance)"
          # 다른 자동 커밋(LLM 재평가 Routine 등)과 경합해 push 가 거부될 수 있으므로,
          # 거부되면 원격 변경을 rebase 로 얹어 1회 재시도한다(그날 갱신이 조용히 유실되지 않도록).
          # 업데이트 세션도 같은 생성 파일(quotes·stock-ta·history 등)을 다시 만들어 커밋하므로 rebase 가
          # 충돌하기 쉽다. 충돌하면 한쪽을 통째로 택하지 않고(세션의 분석 변경 유실 방지) 원격 최신을
          # 기준으로 이번 실행의 야후 산출물만 얹은 뒤 파생 파일(기준일·스냅샷·커버리지)을 다시 만든다.
          if ! git push origin HEAD:${TARGET_BRANCH}; then
            echo "push 거부 — origin 을 rebase 후 재시도"
            git fetch origin "${TARGET_BRANCH}"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort
              echo "::warning::rebase 충돌 — 원격 최신 위에 이번 실행 산출물을 다시 얹습니다"
              GEN="$RUNNER_TEMP/gen"; mkdir -p "$GEN"
              cp data/quotes.js data/indices.js data/stock-ta.js data/liquidity-auto.js data/watch-candidates.js data/tickers.js "$GEN/"
              git reset --hard FETCH_HEAD
              cp "$GEN"/* data/
              node scripts/update-consensus.js || true
              node scripts/daily-maintenance.js || true
              node scripts/coverage.js --emit || true
              git add data/quotes.js data/recommendations.js data/history.js data/tp-history.json data/indices.js data/stock-ta.js data/liquidity-auto.js data/watch-candidates.js data/coverage-status.js data/tickers.js data/consensus.js data/reco-ops.json
              git diff --cached --quiet || git commit -m "매일 데이터 갱신 (자동) — 시세·기준일·스냅샷 (update-quotes + daily-maintenance)"
            fi
            # 원격 변경과 합쳐진 결과도 커밋 전과 같은 게이트를 통과해야 push 한다
            node scripts/validate-reco.js
            git push origin HEAD:${TARGET_BRANCH}
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 푸시는 push 트리거를 안 태우므로, 바뀌었을 때만 배포를 명시적으로 건다.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "${TARGET_BRANCH}"

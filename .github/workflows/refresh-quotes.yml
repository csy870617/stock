name: Refresh quotes (daily, token-free)

# 매일 앱 최신성을 순수 스크립트로 보장한다(LLM 토큰 0):
#   1) update-quotes.js  → data/quotes.js (실제 Yahoo 시세)
#   2) daily-maintenance.js → recommendations.js generatedAt(오늘) + 지수·스냅샷(history.js)
# 이렇게 하면 LLM 추천 Routine이 실패해도 앱은 매일 오늘자 날짜·시세·스냅샷을 유지한다.
# (종목별 심층 분석·발굴은 LLM Routine이 성공할 때 그 위에 얹힌다.)
# 바뀌어 커밋되면 마지막 스텝이 deploy-pages 를 직접 트리거해 페이지를 재배포한다.
#
# 왜 직접 트리거하나: GITHUB_TOKEN 으로 만든 푸시는 deploy-pages 의 push 트리거를 태우지
#       않는다(무한 루프 방지 정책). 그래서 workflow_dispatch 로 명시적으로 배포를 건다.
#
# 참고: 예약(cron)·수동(dispatch) 실행은 이 워크플로우가 "기본 브랜치"에 존재해야 동작한다
#       (GitHub 정책). 이 저장소의 기본 브랜치는 아래 TARGET_BRANCH 와 같으므로 병합하면 동작한다.
on:
  schedule:
    - cron: "0 7 * * 1-5"    # 평일 07:00 UTC ≈ 한국 장 마감 이후
    - cron: "0 21 * * 1-5"   # 평일 21:00 UTC ≈ 미국 장 마감 이후
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # deploy-pages 를 workflow_dispatch 로 트리거하기 위해 필요

concurrency:
  group: refresh-quotes
  cancel-in-progress: false

env:
  TARGET_BRANCH: claude/stock-analysis-recommendation-v9310x   # 배포(=기본) 브랜치

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update quotes (Yahoo → data/quotes.js)
        run: node scripts/update-quotes.js

      - name: Daily maintenance (generatedAt + 지수·스냅샷, token-free)
        run: node scripts/daily-maintenance.js

      # 신뢰도 게이트 — 구조·형식·계산 정합성이 깨진 데이터는 커밋하지 않는다
      - name: Validate data (guardrail)
        run: node scripts/validate-reco.js

      - name: Commit & push if changed
        id: commit
        run: |
          if git diff --quiet -- data/quotes.js data/recommendations.js data/history.js; then
            echo "변화 없음 — 커밋 생략"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.js data/recommendations.js data/history.js
          git commit -m "매일 데이터 갱신 (자동) — 시세·기준일·스냅샷 (update-quotes + daily-maintenance)"
          # 다른 자동 커밋(LLM 재평가 Routine 등)과 경합해 push 가 거부될 수 있으므로,
          # 거부되면 원격 변경을 rebase 로 얹어 1회 재시도한다(그날 갱신이 조용히 유실되지 않도록).
          if ! git push origin HEAD:${TARGET_BRANCH}; then
            echo "push 거부 — origin 을 rebase 후 재시도"
            git pull --rebase origin ${TARGET_BRANCH}
            git push origin HEAD:${TARGET_BRANCH}
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 푸시는 push 트리거를 안 태우므로, 바뀌었을 때만 배포를 명시적으로 건다.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "${TARGET_BRANCH}"

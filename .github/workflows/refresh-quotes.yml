name: Refresh quotes (daily, token-free)

# 매일 앱 최신성을 순수 스크립트로 보장한다(LLM 토큰 0):
#   1) update-quotes.js  → data/quotes.js (실제 Yahoo 시세)
#   1-2) update-consensus.js → data/consensus.js + recommendations.js targetPrice (네이버 컨센서스)
#   2) update-indices.js → data/indices.js (지수 단기/장기 이동평균·RSI·추세·지지/저항·신호)
#   3) update-stock-ta.js → data/stock-ta.js (개별 종목 단기/장기 기술적 분석) + data/chart/<ticker>.json (종목 상세 캔들 차트 — 일·주·월봉)
#   4) update-liquidity-gauge.js → data/liquidity-auto.js (시장지표 기반 유동성 게이지 baseline)
#   5) screen-watch.js → data/watch-candidates.js (관심종목 차트 후보: 턴어라운드·신고가 + 기존 태그 유효성)
#   5-2) screen-discovery.js(매일, 히든 6일마다) → check-defects.js → data/candidates.js (주제별 후보 + 편성 결격 점검)
#   5-3) AI 단계(Claude API — 저장소 Secrets 에 ANTHROPIC_API_KEY 가 있을 때만, 2026-10-21~):
#        ai-defects.js(점검 필요 → 실질·형식·없음 판정) → ai-daily.js(시황·유동성·연준/한은·지수 대응·Top Pick) → ai-news.js(종목 뉴스 한 줄)
#   (월) gen-tickers.js → data/tickers.js (관심종목 검색 사전, 주 1회)
#   6) daily-maintenance.js → recommendations.js generatedAt(오늘) + 지수·스냅샷(history.js)
# 이렇게 하면 LLM 추천 Routine이 실패해도 앱은 매일 오늘자 날짜·시세·지수 기술적 분석·유동성 baseline·스냅샷을 유지한다.
# (종목별 심층 분석·발굴, 유동성 '이벤트·내러티브 판단'은 온디맨드로 남아 baseline 을 보정한다.)
# 바뀌어 커밋되면 마지막 스텝이 deploy-pages 를 직접 트리거해 페이지를 재배포한다.
#
# 왜 직접 트리거하나: GITHUB_TOKEN 으로 만든 푸시는 deploy-pages 의 push 트리거를 태우지
#       않는다(무한 루프 방지 정책). 그래서 workflow_dispatch 로 명시적으로 배포를 건다.
#
# 참고: 예약(cron)·수동(dispatch) 실행은 이 워크플로우가 "기본 브랜치"에 존재해야 동작한다
#       (GitHub 정책). 이 저장소의 기본 브랜치는 아래 TARGET_BRANCH 와 같으므로 병합하면 동작한다.
on:
  schedule:
    - cron: "0 7 * * 1-5"    # 평일 07:00 UTC ≈ 한국 장 마감 이후
    - cron: "0 21 * * 1-5"   # 평일 21:00 UTC ≈ 미국 장 마감 이후
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # deploy-pages 를 workflow_dispatch 로 트리거하기 위해 필요

concurrency:
  group: refresh-quotes
  cancel-in-progress: false

env:
  TARGET_BRANCH: claude/stock-analysis-recommendation-v9310x   # 배포(=기본) 브랜치
  # AI 단계 스위치 — 키 값은 각 스텝 env 로만 넘기고 여기서는 '있는지'만 본다
  HAS_AI_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 데이터 스텝은 continue-on-error — 한 스크립트가 야후 장애 등으로 죽어도 나머지가
      # 만든 갱신분은 살려서 커밋한다(스크립트 내부 폴백이 이전 값을 유지하므로 부분 갱신이 안전).
      # 정합성은 마지막 validate 스텝이 하드 게이트로 보증한다.
      - name: Update quotes (Yahoo → data/quotes.js)
        run: node scripts/update-quotes.js
        continue-on-error: true

      # 컨센서스 목표가(네이버 증권 — 한국 FnGuide·미국 LSEG 집계) → data/consensus.js + recommendations.js targetPrice.
      # 기준일 30일 초과·±50% 초과 변화는 반영하지 않고 표시/경고만 남긴다(세션이 웹 검색으로 확인).
      - name: Update consensus targets (Naver → targetPrice, token-free)
        run: node scripts/update-consensus.js
        continue-on-error: true

      - name: Update index technicals (Yahoo → data/indices.js, token-free)
        run: node scripts/update-indices.js
        continue-on-error: true

      - name: Update stock technicals (Yahoo → data/stock-ta.js, token-free)
        run: node scripts/update-stock-ta.js
        continue-on-error: true

      # 다음 실적 일정·직전 서프라이즈(한국 네이버 irScheduleInfo·미국 나스닥) — 카드 '전망' 블록이 읽는다(토큰 0).
      - name: Update earnings calendar (Naver·Nasdaq → data/events.js, token-free)
        run: node scripts/update-events.js
        continue-on-error: true

      # 밸류에이션(PER·선행 PER·PBR·배당수익률)·최근 분기 실적 — 출처 값 그대로 카드에 보인다(세션 전사 오류 제거, 토큰 0).
      - name: Update fundamentals (Naver·Nasdaq → data/fundamentals.js, token-free)
        run: node scripts/update-fundamentals.js
        continue-on-error: true

      # 기술 대응 문장(techNote v3) — 엔진 숫자(이평·구름·지지/저항·매물대·수급·예상 범위)로 매일 자동 생성(토큰 0).
      # stock-ta·events 다음에 돌아야 같은 거래일 숫자로 쓴다.
      - name: Generate technical notes (stock-ta·events → techNote, token-free)
        run: node scripts/gen-technote.js
        continue-on-error: true

      - name: Update liquidity gauge baseline (Yahoo → data/liquidity-auto.js, token-free)
        run: node scripts/update-liquidity-gauge.js
        continue-on-error: true
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}   # 한국은행 ECOS 인증키(저장소 Secrets) — 없으면 sample 키로 받는다(lib-ratemodel.js)

      # 관심종목 차트 후보(턴어라운드·신고가) + 기존 관심종목 태그 유효성 — LLM 루틴이 읽어 리서치·편입
      - name: Screen watch candidates (Yahoo → data/watch-candidates.js, token-free)
        run: node scripts/screen-watch.js
        continue-on-error: true

      # 발굴 후보 스크린 — 매일 아침 1회(18시간 이내 생성본이 있으면 건너뜀, 토큰 0). 2026-10-18 매일 결격 점검 도입으로 주 1회 → 매일.
      # 시장 전체(한국 400·미국 600)를 같은 잣대로 훑어 세션이 검색 예산을 '후보 검증'에만 쓰게 한다.
      # 우량·성장·저평가·배당은 2026-10-17 검증된 주제 팩터(screen-factors.js — 한국 기업현황·미국 SEC/야후, 약 5분 추가)로 거르고 점수를 매긴다.
      # 히든 두 그룹은 screen-hidden.js(한국 시총 3천억~12조 약 600종목의 5년 재무·현금, 미국 SEC XBRL·나스닥 EPS)를
      # 함께 돌려 15~20분이 더 걸려 6일마다만 다시 만든다(--hidden-stale 6) — 실패해도 이전 히든 그룹을 유지한다.
      - name: Screen discovery candidates (daily, → data/discovery-candidates.js, token-free)
        run: node scripts/screen-discovery.js --if-stale 0.75 --hidden-stale 6
        continue-on-error: true

      # 매일 결격 점검 + 주제별 후보 목록 — 편성 종목의 목표가 소진·추세 붕괴·주제 기준 미달(자동 결격)과
      # 실적 발표·급락·목표가 하향(점검 필요)을 찾아 data/candidates.js 에 쓴다(앱 '후보 종목'·결격 표시). 판정·교체는 A 회차 세션(CLAUDE.md §3-7).
      - name: Check defects + candidate list (→ data/candidates.js, token-free)
        run: node scripts/check-defects.js
        continue-on-error: true

      # ── AI 단계(Claude API) — 저장소 Settings → Secrets → Actions 에 ANTHROPIC_API_KEY 가 있을 때만 돈다(없으면 건너뜀) ──
      # 세션(A 루틴)이 쓰던 매일 항목을 세션 없이 채운다. 실패해도 나머지 갱신은 커밋한다(continue-on-error).
      # 사용량·오류는 data/ai-status.js 에 남아 앱 'AI 연결' 창이 보여 준다. 교체(add/remove)는 하지 않는다 — 세션 몫.
      - name: Install Anthropic SDK (AI steps only)
        if: env.HAS_AI_KEY == 'true'
        run: npm ci --no-audit --no-fund
        continue-on-error: true

      # 결격 '점검 필요' 종목만 웹 검색으로 판정(Sonnet 5.5, 종목당 검색 ≤3) → candidate-notes.json(by:"ai") → candidates.js 재생성
      - name: AI defect verdicts (점검 필요 → candidate-notes.json)
        if: env.HAS_AI_KEY == 'true'
        run: node scripts/ai-defects.js
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 시황·유동성·연준/한은 판단·지수 대응·Top Pick(Opus 5.5, 검색 ≤6) — 오늘(T) 몫이 비었거나 AI 가 쓴 것에 새 종가가 생겼을 때만.
      # 세션이 같은 날 쓴 문장은 덮지 않는다(--if-stale).
      - name: AI daily analysis (시황·유동성·지수 대응·Top Pick)
        if: env.HAS_AI_KEY == 'true'
        run: node scripts/ai-daily.js --if-stale
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 종목별 최근 3일 헤드라인(네이버·야후, 무료) → 회사 소식 한 줄(Haiku 5.5, 검색 없음) → data/news.js
      - name: AI stock news one-liners (→ data/news.js)
        if: env.HAS_AI_KEY == 'true'
        run: node scripts/ai-news.js
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 관심종목 검색 사전(이름→코드) — 신규 상장 반영용, 월요일 아침 실행에서만 주 1회.
      # KRX 가 막히면 네이버로 폴백하고, 둘 다 실패한 국가는 기존 값을 유지한다(스크립트 내부 처리).
      - name: Refresh ticker dictionary (weekly, → data/tickers.js, token-free)
        if: github.event.schedule == '0 7 * * 1-5'
        run: if [ "$(date -u +%u)" = "1" ]; then node scripts/gen-tickers.js; else echo "월요일만 실행 — 건너뜀"; fi
        continue-on-error: true

      - name: Daily maintenance (generatedAt + 지수·스냅샷, token-free)
        run: node scripts/daily-maintenance.js
        continue-on-error: true

      # 앱 상단 '데이터 신선도' 패널이 읽는 상태 파일 — 매일·회전 항목의 커버리지를 기록한다.
      # coverage.js 는 미완료 시 exit 1 이지만 --emit 은 '게이트'가 아니라 '보고'라 항상 exit 0 이다.
      - name: Emit coverage status (→ data/coverage-status.js, token-free)
        run: node scripts/coverage.js --emit
        continue-on-error: true

      # 신뢰도 게이트 — 구조·형식·계산 정합성이 깨진 데이터는 커밋하지 않는다
      - name: Validate data (guardrail)
        run: node scripts/validate-reco.js

      - name: Commit & push if changed
        id: commit
        run: |
          if git diff --quiet -- data/quotes.js data/recommendations.js data/history.js data/tp-history.json data/indices.js data/stock-ta.js data/events.js data/fundamentals.js data/liquidity-auto.js data/watch-candidates.js data/discovery-candidates.js data/candidates.js data/coverage-status.js data/tickers.js data/consensus.js data/reco-ops.json data/chart data/liquidity.js data/index-notes.js data/candidate-notes.json data/news.js data/ai-status.js; then
            echo "변화 없음 — 커밋 생략"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.js data/recommendations.js data/history.js data/tp-history.json data/indices.js data/stock-ta.js data/events.js data/fundamentals.js data/liquidity-auto.js data/watch-candidates.js data/discovery-candidates.js data/candidates.js data/coverage-status.js data/tickers.js data/consensus.js data/reco-ops.json data/chart data/liquidity.js data/index-notes.js data/candidate-notes.json data/news.js data/ai-status.js
          git commit -m "매일 데이터 갱신 (자동) — 시세·기준일·스냅샷 (update-quotes + daily-maintenance)"
          # 다른 자동 커밋(LLM 재평가 Routine 등)과 경합해 push 가 거부될 수 있으므로,
          # 거부되면 원격 변경을 rebase 로 얹어 1회 재시도한다(그날 갱신이 조용히 유실되지 않도록).
          # 업데이트 세션도 같은 생성 파일(quotes·stock-ta·history 등)을 다시 만들어 커밋하므로 rebase 가
          # 충돌하기 쉽다. 충돌하면 한쪽을 통째로 택하지 않고(세션의 분석 변경 유실 방지) 원격 최신을
          # 기준으로 이번 실행의 야후 산출물만 얹은 뒤 파생 파일(기준일·스냅샷·커버리지)을 다시 만든다.
          if ! git push origin HEAD:${TARGET_BRANCH}; then
            echo "push 거부 — origin 을 rebase 후 재시도"
            git fetch origin "${TARGET_BRANCH}"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort
              echo "::warning::rebase 충돌 — 원격 최신 위에 이번 실행 산출물을 다시 얹습니다"
              GEN="$RUNNER_TEMP/gen"; mkdir -p "$GEN"
              cp data/quotes.js data/indices.js data/stock-ta.js data/events.js data/fundamentals.js data/liquidity-auto.js data/watch-candidates.js data/discovery-candidates.js data/tickers.js data/news.js data/ai-status.js "$GEN/"
              cp -r data/chart "$RUNNER_TEMP/gen-chart" 2>/dev/null || true
              git reset --hard FETCH_HEAD
              cp "$GEN"/* data/
              # 종목 상세 차트(data/chart/<ticker>.json)도 이번 실행 산출물로 — 폴더째 바꾼다
              if [ -d "$RUNNER_TEMP/gen-chart" ]; then rm -rf data/chart && cp -r "$RUNNER_TEMP/gen-chart" data/chart; fi
              node scripts/update-consensus.js || true
              node scripts/gen-technote.js || true
              # AI 결과는 API 를 다시 부르지 않고 이번 실행분(.ai-cache)을 다시 얹는다 — 원격에 같은 날 이후로 쓴 항목은 원격을 남긴다
              node scripts/ai-defects.js --reapply || true
              node scripts/ai-daily.js --reapply || true
              node scripts/daily-maintenance.js || true
              node scripts/check-defects.js || true
              node scripts/coverage.js --emit || true
              git add data/quotes.js data/recommendations.js data/history.js data/tp-history.json data/indices.js data/stock-ta.js data/events.js data/fundamentals.js data/liquidity-auto.js data/watch-candidates.js data/discovery-candidates.js data/candidates.js data/coverage-status.js data/tickers.js data/consensus.js data/reco-ops.json data/chart data/liquidity.js data/index-notes.js data/candidate-notes.json data/news.js data/ai-status.js
              git diff --cached --quiet || git commit -m "매일 데이터 갱신 (자동) — 시세·기준일·스냅샷 (update-quotes + daily-maintenance)"
            fi
            # 원격 변경과 합쳐진 결과도 커밋 전과 같은 게이트를 통과해야 push 한다
            node scripts/validate-reco.js
            git push origin HEAD:${TARGET_BRANCH}
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 푸시는 push 트리거를 안 태우므로, 바뀌었을 때만 배포를 명시적으로 건다.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "${TARGET_BRANCH}"

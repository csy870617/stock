<style>
:root {
  --page:        #f5f5f3;
  --surface:     #ffffff;
  --surface-2:   #ececea;
  --ink:         #14140f;
  --ink-2:       #56554f;
  --muted:       #9a988f;
  --line:        rgba(20,20,15,0.09);
  --grid:        #e8e7e2;
  --accent:      #3a63e0;
  --tier1:       #3466e0;
  --tier2:       #12a150;
  --tier3:       #d99320;
  --up:          #0f8a3c;
  --down:        #d0392f;
  --meter-track: #ececea;
  --meter-lo:    #a8c0ff;
  --meter-hi:    #3466e0;
  --chip-bg:     #ececeac9;
  --kr-up:       #d0392f;
  --kr-down:     #2560c8;
  --bar:         rgba(255,255,255,0.72);
  --shadow-sm:   0 1px 2px rgba(20,20,15,0.05);
  --shadow-lg:   0 8px 28px rgba(20,20,15,0.10);
  --r:           16px;
}
:root[data-theme="dark"] {
  --page:        #0a0a0a;
  --surface:     #161615;
  --surface-2:   #242422;
  --ink:         #f5f5f1;
  --ink-2:       #b8b7ad;
  --muted:       #7f7e76;
  --line:        rgba(255,255,255,0.10);
  --grid:        #2a2a27;
  --accent:      #6f92f5;
  --tier1:       #5b86f0;
  --tier2:       #23b365;
  --tier3:       #e0a53a;
  --up:          #2fb457;
  --down:        #e8635a;
  --meter-track: #2a2a27;
  --meter-lo:    #39508f;
  --meter-hi:    #5b86f0;
  --chip-bg:     #26261f;
  --kr-up:       #e8635a;
  --kr-down:     #5f92ea;
  --bar:         rgba(14,14,13,0.72);
  --shadow-sm:   0 1px 2px rgba(0,0,0,0.3);
  --shadow-lg:   0 8px 28px rgba(0,0,0,0.45);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page:        #0a0a0a;
    --surface:     #161615;
    --surface-2:   #242422;
    --ink:         #f5f5f1;
    --ink-2:       #b8b7ad;
    --muted:       #7f7e76;
    --line:        rgba(255,255,255,0.10);
    --grid:        #2a2a27;
    --accent:      #6f92f5;
    --tier1:       #5b86f0;
    --tier2:       #23b365;
    --tier3:       #e0a53a;
    --up:          #2fb457;
    --down:        #e8635a;
    --meter-track: #2a2a27;
    --meter-lo:    #39508f;
    --meter-hi:    #5b86f0;
    --chip-bg:     #26261f;
    --kr-up:       #e8635a;
    --kr-down:     #5f92ea;
    --bar:         rgba(14,14,13,0.72);
    --shadow-sm:   0 1px 2px rgba(0,0,0,0.3);
    --shadow-lg:   0 8px 28px rgba(0,0,0,0.45);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; }
::selection { background: color-mix(in srgb, var(--accent) 22%, transparent); }

/* ── 상단 바 ── */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--bar);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 1080px; margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 7px; font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em; }
.brand .fl { font-size: 1.02rem; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.gen-date { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
.icon-btn {
  width: 34px; height: 34px; display: grid; place-items: center;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  border-radius: 10px; font-size: 0.95rem; cursor: pointer; transition: background .15s, border-color .15s;
}
.icon-btn:hover { background: var(--surface-2); }
.sim-link { display: inline-flex; line-height: 0; text-decoration: none; }
.sim-link img { width: 34px; height: 34px; border-radius: 10px; background: #fff; display: block; border: 1px solid var(--line); transition: border-color .15s; }
.sim-link:hover img { border-color: var(--tier3); }

.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 72px; }

/* ── 시황 리드 ── */
.market-note { font-size: 0.95rem; color: var(--ink-2); line-height: 1.65; margin: 4px 0 24px; }
.mn-tag {
  display: inline-block; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.03em;
  color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
  padding: 2px 8px; border-radius: 6px; margin-right: 9px; vertical-align: 1px;
}

/* ── 통계 타일 ── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 0 0 24px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.tile .k { color: var(--muted); font-size: 0.74rem; margin-bottom: 5px; }
.tile .v { font-size: 1.4rem; font-weight: 750; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.tile .v.up { color: var(--up); }

/* ── 세그먼트 · 칩 ── */
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 12px; }
.seg button {
  border: 0; background: transparent; color: var(--ink-2); padding: 6px 15px;
  font-size: 0.88rem; font-weight: 600; border-radius: 9px; cursor: pointer; transition: background .15s, color .15s;
}
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 6px 13px; font-size: 0.83rem; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: background .15s, color .15s, border-color .15s;
}
.chip:hover { border-color: color-mix(in srgb, var(--ink) 22%, transparent); }
.chip.on { background: var(--ink); color: var(--page); border-color: var(--ink); }

/* ── Top Picks ── */
.picks { margin: 0 0 26px; }
.picks-head { margin-bottom: 12px; }
.picks-head h2 { font-size: 1.05rem; font-weight: 750; letter-spacing: -0.02em; }
.picks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.pick {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; position: relative;
  transition: transform .16s ease, box-shadow .16s ease;
}
.pick:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.pick .rank { position: absolute; top: 11px; right: 13px; font-size: 1.05rem; }
.pick .thm { display: inline-flex; align-items: center; gap: 4px; font-size: 0.71rem; color: var(--ink-2);
  background: var(--chip-bg); border-radius: 999px; padding: 3px 9px; width: fit-content; }
.pick .nm { font-weight: 700; font-size: 0.98rem; }
.pick .nm .tk { color: var(--muted); font-weight: 400; font-size: 0.75rem; margin-left: 5px; }
.pick .up-big { font-size: 1.35rem; font-weight: 800; color: var(--up); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.pick .sub { color: var(--ink-2); font-size: 0.8rem; }

/* ── 툴바 ── */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 16px; }
.toolbar input[type="search"] {
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  border-radius: 11px; padding: 8px 13px; font-size: 0.9rem; min-width: 200px; flex: 1; max-width: 320px;
  transition: border-color .15s, box-shadow .15s;
}
.toolbar input[type="search"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
.toolbar input[type="search"]::placeholder { color: var(--muted); }
.toolbar select {
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  border-radius: 11px; padding: 8px 11px; font-size: 0.85rem; cursor: pointer;
}
.toolbar .lbl { color: var(--muted); font-size: 0.8rem; }

/* ── 주제 설명 ── */
.theme-desc {
  color: var(--ink-2); font-size: 0.9rem; line-height: 1.65; margin: 2px 0 18px;
  padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.theme-desc strong { color: var(--ink); }

/* ── 티어 그룹 ── */
.tier-group { margin-bottom: 26px; }
.tier-head {
  display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.92rem;
  margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--grid);
}
.tier-head .dot { width: 9px; height: 9px; border-radius: 50%; }
.tier-head .tier-n { color: var(--muted); font-weight: 400; font-size: 0.8rem; }

/* ── 카드 ── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 18px 20px; display: flex; flex-direction: column; gap: 11px; box-shadow: var(--shadow-sm);
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--ink) 12%, transparent); }
.card .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card h3 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
.card .tk { color: var(--muted); font-size: 0.76rem; font-weight: 400; margin-left: 5px; }
.badge {
  font-size: 0.7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  background: var(--chip-bg); color: var(--ink-2);
}
.badge .dot { width: 8px; height: 8px; border-radius: 50%; }
.badges { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

.prices { display: flex; gap: 20px; flex-wrap: wrap; }
.pv .k { color: var(--muted); font-size: 0.72rem; }
.pv .v { font-size: 1.02rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.pv .v.up { color: var(--up); }
.pv .v.down { color: var(--down); }

.meter { height: 6px; border-radius: 4px; background: var(--meter-track); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--meter-lo), var(--meter-hi)); }
.meter-row { display: flex; align-items: center; gap: 10px; }
.meter-row .meter { flex: 1; }
.meter-row .pct { font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; }
.meter-row .pct.up { color: var(--up); }
.meter-row .pct.down { color: var(--down); }

.earn { color: var(--ink-2); font-size: 0.84rem; line-height: 1.55; border-left: 3px solid var(--grid); padding-left: 11px; }
.thesis { font-size: 0.9rem; line-height: 1.6; }
.risks { color: var(--ink-2); font-size: 0.84rem; line-height: 1.55; }
.risks b { color: var(--ink); font-weight: 600; }
.links { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: auto; padding-top: 4px; }
.links a { color: var(--accent); font-size: 0.84rem; font-weight: 500; text-decoration: none; }
.links a:hover { text-decoration: underline; }
.src { color: var(--muted); font-size: 0.75rem; }
.src a { color: var(--muted); }

.warn-badge { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--ink-2); white-space: nowrap; }
.stale { color: var(--tier3); font-weight: 600; }
.live-tag { color: var(--up); font-weight: 700; }

.empty { color: var(--muted); padding: 48px 0; text-align: center; }

/* ── 표 ── */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 0.86rem; min-width: 760px; }
.tbl th {
  text-align: left; color: var(--muted); font-weight: 600; font-size: 0.74rem;
  padding: 11px 13px; border-bottom: 1px solid var(--grid); white-space: nowrap; cursor: pointer; user-select: none;
}
.tbl th.num, .tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td { padding: 10px 13px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl .nm { font-weight: 600; }
.tbl .tk { color: var(--muted); font-size: 0.75rem; }
.tbl .up { color: var(--up); font-weight: 700; }
.tbl .down { color: var(--down); font-weight: 700; }
.tbl .kr-up { color: var(--kr-up); font-weight: 700; }
.tbl .kr-down { color: var(--kr-down); font-weight: 700; }
.tbl a { color: var(--accent); text-decoration: none; }
.tbl .mini-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }

/* ── 유동성 게이지 ── */
.liq { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin-bottom: 22px; }
.liq .liq-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.liq .liq-head h2 { font-size: 1.02rem; font-weight: 750; letter-spacing: -0.01em; }
.liq .liq-as { color: var(--muted); font-size: 0.78rem; }
.liq .liq-headline { font-size: 0.94rem; color: var(--ink); line-height: 1.6; margin-bottom: 16px; }
.liq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 620px) { .liq-grid { grid-template-columns: 1fr; } }
.liq-col { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.liq-col h3 { font-size: 0.92rem; font-weight: 700; margin-bottom: 12px; }
.liq-term { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.liq-term .lbl { color: var(--muted); font-size: 0.78rem; min-width: 72px; }
.gauge { display: flex; gap: 4px; flex: 1; }
.gauge .seg5 { flex: 1; height: 8px; border-radius: 4px; background: var(--meter-track); }
.liq-term .rank { font-size: 0.82rem; font-weight: 700; min-width: 64px; text-align: right; }
.liq-drivers { margin: 10px 0 0; padding-left: 16px; }
.liq-drivers li { font-size: 0.82rem; color: var(--ink-2); margin-bottom: 4px; line-height: 1.5; }
.liq-foot { color: var(--muted); font-size: 0.78rem; margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.liq-foot .nc { color: var(--ink-2); }
.liq-foot a { color: var(--muted); }

footer.site { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--grid); color: var(--muted); font-size: 0.8rem; line-height: 1.6; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="fl">🔥</span> 주식 추천</div>
    <div class="top-actions">
      <span class="gen-date" id="genDate"></span>
      <button class="icon-btn" id="themeBtn" type="button" title="라이트·다크 전환" aria-label="테마 전환">🌓</button>
      <a class="sim-link" href="https://csy870617.github.io/TradingSimulator/" target="_blank" rel="noopener" title="트레이딩 시뮬레이터 열기">
        <img src="icon2.png" alt="트레이딩 시뮬레이터">
      </a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="market-note" id="marketNote"></div>

  <div class="liq" id="liqBox" style="display:none">
    <div class="liq-head">
      <h2>거시 유동성</h2>
      <span class="liq-as" id="liqAs"></span>
    </div>
    <div class="liq-headline" id="liqHeadline"></div>
    <div class="liq-grid" id="liqGrid"></div>
    <div class="liq-foot" id="liqFoot"></div>
  </div>

  <section class="picks" id="picksBox" style="display:none">
    <div class="picks-head">
      <h2>오늘의 Top Picks</h2>
    </div>
    <div class="picks-grid" id="picksGrid"></div>
  </section>

  <div class="controls">
    <div class="seg" id="countrySeg">
      <button data-c="korea" class="on" type="button">🇰🇷 한국</button>
      <button data-c="us" type="button">🇺🇸 미국</button>
    </div>
    <div class="chips" id="themeChips"></div>
  </div>

  <div class="toolbar">
    <div class="seg" id="viewSeg">
      <button data-v="cards" class="on" type="button">카드</button>
      <button data-v="table" type="button">표</button>
      <button data-v="perf" type="button">성과</button>
    </div>
  </div>
  <div class="theme-desc" id="themeDesc"></div>

  <div id="cards"></div>

  <footer class="site">
    <p id="disclaimer"></p>
    <p style="margin-top:6px;">매일 오전 6시(LA) 자동 갱신 · 현재가 🟢는 실시간 시세</p>
  </footer>
</div>

<script src="data/config.js"></script>
<script src="data/liquidity.js"></script>
<script src="data/recommendations.js"></script>
<script src="data/history.js"></script>
<script>
(function () {
  var D = window.STOCK_DATA;
  var L = window.LIQUIDITY_DATA;
  // 히스토리는 매일 스크립트가 새로 쓰므로, 한 번의 불완전 기록이 페이지 전체를 막지 않도록
  // 유효한 스냅샷(date 문자열 + stocks 배열)만 사용한다.
  var H = (window.STOCK_HISTORY || [])
    .filter(function (s) { return s && typeof s.date === "string" && Array.isArray(s.stocks); })
    .sort(function (a, b) { return a.date.localeCompare(b.date); });
  var state = {
    country: "korea",
    theme: (D && D.themes && D.themes[0] && D.themes[0].key) || "core",
    q: "", sort: "tier", view: "cards"
  };

  var root = document.documentElement;
  document.getElementById("themeBtn").addEventListener("click", function () {
    var cur = root.getAttribute("data-theme");
    var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    var effective = cur || (prefersDark ? "dark" : "light");
    root.setAttribute("data-theme", effective === "dark" ? "light" : "dark");
  });

  if (!D) {
    document.getElementById("cards").innerHTML =
      '<div class="empty">data/recommendations.js 를 불러오지 못했습니다.</div>';
    return;
  }

  document.getElementById("genDate").textContent = "기준일 " + D.generatedAt;
  document.getElementById("marketNote").innerHTML =
    '<span class="mn-tag">시황</span>' + esc(D.marketNote);
  document.getElementById("disclaimer").textContent = D.disclaimer;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function fmtPrice(v, country) {
    if (v == null) return "–";
    return country === "korea"
      ? "₩" + Math.round(v).toLocaleString("ko-KR")
      : "$" + Number(v).toLocaleString("en-US", { maximumFractionDigits: 2 });
  }
  function fmtPct(v) {
    if (v == null) return "–";
    return (v > 0 ? "+" : "") + Number(v).toFixed(1) + "%";
  }
  // 정렬용: 값이 없거나 숫자가 아니면 기본값 반환 (0을 -999 로 오인하지 않도록)
  function numOr(v, def) { return (typeof v === "number" && !isNaN(v)) ? v : def; }
  var TIER_COLORS = { 1: "var(--tier1)", 2: "var(--tier2)", 3: "var(--tier3)" };
  var TIER_NAMES = { 1: "Tier 1 · 최우선", 2: "Tier 2 · 차선", 3: "Tier 3 · 관심" };
  function tierMeta(t) {
    return { label: TIER_NAMES[t] || "Tier ?", color: TIER_COLORS[t] || "var(--muted)" };
  }
  function themeMeta(key) {
    var t = (D.themes || []).filter(function (x) { return x.key === key; })[0];
    return t || { key: key, label: key, emoji: "", desc: "" };
  }

  function staleDays(s) {
    if (!s.priceDate || !D.generatedAt) return 0;
    var d = (new Date(D.generatedAt) - new Date(s.priceDate)) / 86400000;
    return isNaN(d) ? 0 : Math.round(d);
  }

  // ── 실시간 가격 레이어 (전용 시세 서버 경유 Yahoo 시세) ──
  // data/config.js 의 quotesApi 로 배치 조회한다. 서버가 CORS 헤더를 붙여 돌려주므로
  // 브라우저 CORS 문제가 없다. 미설정·조회 실패 시 조용히 스냅샷(기존 종가)으로 폴백.
  var QUOTES_API = ((window.APP_CONFIG && window.APP_CONFIG.quotesApi) || "").replace(/\/+$/, "");
  var liveCache = {};     // ticker → {price, date} | null(응답에 없음) | undefined(미조회)
  var liveInflight = {};
  var liveSupported = typeof window.fetch === "function" && typeof AbortController === "function" && !!QUOTES_API;

  function symbolFor(s) {
    if (s.market === "KOSPI") return s.ticker + ".KS";
    if (s.market === "KOSDAQ") return s.ticker + ".KQ";
    return s.ticker === "BRK.B" ? "BRK-B" : s.ticker;   // 미국(NASDAQ/NYSE)
  }

  // 보이는 종목들의 실시간 가격을 (미조회분만) 한 번의 배치 요청으로 가져온 뒤, 하나라도 성공하면 onDone 호출
  function ensureLive(stocks, onDone) {
    if (!liveSupported) return;
    var todo = [], seen = {};
    stocks.forEach(function (s) {
      if (!s || seen[s.ticker]) return;
      seen[s.ticker] = 1;
      if (liveCache[s.ticker] === undefined && !liveInflight[s.ticker]) todo.push(s);
    });
    if (!todo.length) return;
    todo.forEach(function (s) { liveInflight[s.ticker] = 1; });
    var symbols = todo.map(symbolFor);
    var url = QUOTES_API + (QUOTES_API.indexOf("?") >= 0 ? "&" : "?") + "symbols=" + encodeURIComponent(symbols.join(","));
    var ctrl = new AbortController();
    var to = setTimeout(function () { ctrl.abort(); }, 9000);
    fetch(url, { signal: ctrl.signal, cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (map) {
        clearTimeout(to);
        var any = false;
        todo.forEach(function (s) {
          var v = map && map[symbolFor(s)];
          if (v && typeof v.price === "number" && isFinite(v.price)) { liveCache[s.ticker] = { price: v.price, date: v.date }; any = true; }
          else { liveCache[s.ticker] = null; }   // 응답에 없으면 스냅샷 유지
          delete liveInflight[s.ticker];
        });
        if (any && onDone) onDone();
      })
      .catch(function () {
        clearTimeout(to);
        // 네트워크/서버 오류 → 다음 렌더에서 재시도할 수 있도록 미조회 상태로 되돌림
        todo.forEach(function (s) { delete liveInflight[s.ticker]; });
      });
  }

  // 종목의 "표시용" 현재가·상승여력 — 실시간 값이 있으면 그것으로, 없으면 스냅샷으로
  function effective(s) {
    var lv = liveCache[s.ticker];
    if (lv && lv.price != null) {
      var up = (s.targetPrice != null && lv.price) ? (s.targetPrice - lv.price) / lv.price * 100 : s.upside;
      return { price: lv.price, priceDate: lv.date || s.priceDate, upside: up, live: true };
    }
    return { price: s.price, priceDate: s.priceDate, upside: s.upside, live: false };
  }

  function card(s, country, showTheme) {
    var tm = tierMeta(s.tier);
    var e = effective(s);
    var upCls = e.upside == null ? "" : e.upside >= 0 ? "up" : "down";
    var meterW = e.upside == null ? 0 : Math.max(0, Math.min(100, e.upside * 2));
    var risks = (s.risks || []).map(esc).join(" · ");
    var srcs = (s.sources || []).slice(0, 3).map(function (u, i) {
      return '<a href="' + esc(u) + '" target="_blank" rel="noopener">출처' + (i + 1) + "</a>";
    }).join(" ");
    var themeBadge = "";
    if (showTheme) {
      var thm = themeMeta(s.theme);
      themeBadge = '<span class="badge">' + (thm.emoji ? esc(thm.emoji) + " " : "") + esc(thm.label) + "</span>";
    }
    var warnBadge = (e.upside != null && e.upside <= 0)
      ? '<span class="warn-badge">🎯 목표가 도달</span>' : "";
    var sd = staleDays(s);
    var priceTag = e.live
      ? ' <span class="live-tag" title="실시간">🟢</span>'
      : (sd >= 7 ? ' <span class="stale">⏳ ' + sd + "일 전 종가</span>" : "");
    var priceLabel = e.live ? "현재가" : "현재가 (" + esc(e.priceDate || D.generatedAt) + ")";
    return '<article class="card">' +
      '<div class="head"><h3>' + esc(s.name) + '<span class="tk">' + esc(s.ticker) + " · " + esc(s.market) + "</span></h3>" +
      '<span class="badges">' + themeBadge + warnBadge +
      '<span class="badge"><span class="dot" style="background:' + tm.color + '"></span>' + tm.label + "</span></span></div>" +
      '<div class="prices">' +
        '<div class="pv"><div class="k">' + priceLabel + priceTag + '</div><div class="v">' + fmtPrice(e.price, country) + "</div></div>" +
        '<div class="pv"><div class="k">목표가 (컨센서스)</div><div class="v">' + fmtPrice(s.targetPrice, country) + "</div></div>" +
        '<div class="pv"><div class="k">배당수익률</div><div class="v">' + (s.dividendYield == null ? "–" : Number(s.dividendYield).toFixed(1) + "%") + "</div></div>" +
      "</div>" +
      '<div class="meter-row"><div class="meter"><i style="width:' + meterW + '%"></i></div>' +
      '<div class="pct ' + upCls + '">' + fmtPct(e.upside) + "</div></div>" +
      (s.earnings ? '<div class="earn">' + esc(s.earnings) + "</div>" : "") +
      '<div class="thesis">' + esc(s.thesis) + "</div>" +
      (risks ? '<div class="risks"><b>리스크</b> — ' + risks + "</div>" : "") +
      '<div class="links"><a href="' + esc(s.chartUrl) + '" target="_blank" rel="noopener">📊 차트 보기</a>' +
      '<span class="src">' + srcs + "</span></div>" +
      "</article>";
  }

  function renderThemeChips() {
    document.getElementById("themeChips").innerHTML = (D.themes || []).map(function (t) {
      return '<button class="chip' + (t.key === state.theme ? " on" : "") +
        '" data-theme="' + esc(t.key) + '" type="button">' +
        (t.emoji ? esc(t.emoji) + " " : "") + esc(t.label) + "</button>";
    }).join("");
  }

  function sortList(list) {
    var s = state.sort;
    return list.slice().sort(function (a, b) {
      if (s === "div")   return numOr(b.dividendYield, -Infinity) - numOr(a.dividendYield, -Infinity);
      if (s === "fresh") return new Date(b.priceDate || 0) - new Date(a.priceDate || 0);
      if (s === "tier")  return (a.tier - b.tier) || (numOr(b.upside, -Infinity) - numOr(a.upside, -Infinity));
      return numOr(b.upside, -Infinity) - numOr(a.upside, -Infinity); // upside
    });
  }

  function renderTopPicks() {
    var box = document.getElementById("picksBox");
    var seen = {}, picks = [];
    sortList((D[state.country] || []).filter(function (s) {
      return s.tier === 1 && s.upside != null && s.upside > 0;
    }).sort(function (a, b) { return b.upside - a.upside; })).forEach(function (s) {
      if (seen[s.ticker]) return;
      seen[s.ticker] = true; picks.push(s);
    });
    picks.sort(function (a, b) { return b.upside - a.upside; });
    picks = picks.slice(0, 3);
    if (!picks.length) { box.style.display = "none"; return; }
    box.style.display = "";
    document.getElementById("picksGrid").innerHTML = picks.map(function (s, i) {
      var thm = themeMeta(s.theme);
      return '<div class="pick"><span class="rank">' + ["🥇", "🥈", "🥉"][i] + "</span>" +
        '<span class="thm">' + (thm.emoji ? esc(thm.emoji) + " " : "") + esc(thm.label) + " · Tier 1</span>" +
        '<div class="nm">' + esc(s.name) + '<span class="tk">' + esc(s.ticker) + "</span></div>" +
        '<div class="up-big">+' + Number(s.upside).toFixed(1) + "%</div>" +
        '<div class="sub">' + fmtPrice(s.price, state.country) + " → 목표 " + fmtPrice(s.targetPrice, state.country) +
        (s.dividendYield ? " · 배당 " + Number(s.dividendYield).toFixed(1) + "%" : "") + "</div></div>";
    }).join("");
  }

  function tableView(list, showTheme) {
    var rows = list.map(function (s) {
      var e = effective(s);
      var upCls = e.upside == null ? "" : e.upside >= 0 ? "up" : "down";
      var sd = staleDays(s);
      var thm = themeMeta(s.theme);
      var tm = tierMeta(s.tier);
      var dateCell = e.live
        ? '<span class="live-tag" title="실시간">🟢</span>'
        : esc(s.priceDate || "") + (sd >= 7 ? ' <span class="stale">⏳</span>' : "");
      return "<tr>" +
        '<td><span class="nm">' + esc(s.name) + '</span><br><span class="tk">' + esc(s.ticker) + " · " + esc(s.market) + "</span></td>" +
        (showTheme ? "<td>" + (thm.emoji ? esc(thm.emoji) + " " : "") + esc(thm.label) + "</td>" : "") +
        '<td><span class="mini-dot" style="background:' + tm.color + '"></span>' + s.tier + "</td>" +
        '<td class="num">' + fmtPrice(e.price, state.country) + "</td>" +
        '<td class="num">' + dateCell + "</td>" +
        '<td class="num">' + fmtPrice(s.targetPrice, state.country) + "</td>" +
        '<td class="num ' + upCls + '">' + fmtPct(e.upside) + "</td>" +
        '<td class="num">' + (s.dividendYield == null ? "–" : Number(s.dividendYield).toFixed(1) + "%") + "</td>" +
        '<td><a href="' + esc(s.chartUrl) + '" target="_blank" rel="noopener">차트</a></td></tr>';
    }).join("");
    return '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      "<th>종목</th>" + (showTheme ? "<th>주제</th>" : "") + "<th>Tier</th><th class=\"num\">현재가</th>" +
      '<th class="num">기준일</th><th class="num">목표가</th><th class="num">상승여력</th><th class="num">배당</th><th>링크</th>' +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
  }

  // ── 성과(추천 능력) 계산: 각 종목의 "첫 기록 시점 대비" 수익률과 시장(벤치마크) 대비 초과수익 ──
  function computePerf(country) {
    if (!H.length) return null;
    var benchKey = country === "korea" ? "kospi" : "sp500";
    var last = H[H.length - 1];
    var firstSeen = {}; // ticker → {snap, entry}
    H.forEach(function (snap) {
      snap.stocks.forEach(function (e) {
        if (e.c !== country) return;
        if (!firstSeen[e.t]) firstSeen[e.t] = { snap: snap, entry: e };
      });
    });
    var rows = [];
    last.stocks.forEach(function (e) {
      if (e.c !== country) return;
      var f = firstSeen[e.t];
      if (!f) return;
      var days = Math.round((new Date(last.date) - new Date(f.snap.date)) / 86400000);
      var ret = (f.entry.p && e.p) ? (e.p - f.entry.p) / f.entry.p * 100 : null;
      var benchRet = (f.snap[benchKey] && last[benchKey])
        ? (last[benchKey] - f.snap[benchKey]) / f.snap[benchKey] * 100 : null;
      rows.push({
        name: e.n, ticker: e.t, theme: e.th, tier: f.entry.tier,
        since: f.snap.date, basePrice: f.entry.p, lastPrice: e.p, days: days,
        ret: days > 0 ? ret : null,
        alpha: (days > 0 && ret != null && benchRet != null) ? ret - benchRet : null
      });
    });
    return { rows: rows, last: last, first: H[0], benchKey: benchKey };
  }

  function perfView(country) {
    var pf = computePerf(country);
    if (!pf || !pf.rows.length) return '<div class="empty">아직 성과 기록이 없습니다.</div>';
    var tracked = pf.rows.filter(function (r) { return r.ret != null; });
    var html = "";

    if (!tracked.length) {
      html += '<div class="theme-desc"><strong>기준점 기록 완료</strong> — ' + esc(pf.first.date) +
        " 기준 " + pf.rows.length + "종목. 다음 자동 갱신부터 수익률이 표시됩니다.</div>";
    } else {
      var avg = tracked.reduce(function (a, r) { return a + r.ret; }, 0) / tracked.length;
      var wins = tracked.filter(function (r) { return r.ret > 0; }).length;
      var alphas = tracked.filter(function (r) { return r.alpha != null; });
      var avgAlpha = alphas.length ? alphas.reduce(function (a, r) { return a + r.alpha; }, 0) / alphas.length : null;
      var tierAvg = {};
      [1, 2, 3].forEach(function (t) {
        var g = tracked.filter(function (r) { return r.tier === t; });
        tierAvg[t] = g.length ? g.reduce(function (a, r) { return a + r.ret; }, 0) / g.length : null;
      });
      html += '<div class="tiles">' +
        pTile("평균 수익률", fmtPct(avg), avg > 0) +
        pTile("승률", Math.round(wins / tracked.length * 100) + "% (" + wins + "/" + tracked.length + ")", wins / tracked.length > 0.5) +
        pTile("시장 대비 초과수익", avgAlpha == null ? "–" : fmtPct(avgAlpha), avgAlpha != null && avgAlpha > 0) +
        pTile("Tier1 / T2 / T3", [1, 2, 3].map(function (t) { return tierAvg[t] == null ? "–" : fmtPct(tierAvg[t]); }).join(" · ")) +
        "</div>";
    }

    var rows = pf.rows.slice().sort(function (a, b) {
      return (b.ret == null ? -1e9 : b.ret) - (a.ret == null ? -1e9 : a.ret);
    }).map(function (r) {
      var thm = themeMeta(r.theme); var tm = tierMeta(r.tier);
      var retCls = r.ret == null ? "" : r.ret >= 0 ? "up" : "down";
      var alCls = r.alpha == null ? "" : r.alpha >= 0 ? "up" : "down";
      // 최신 가격: 한국식 등락색 — 기록시 가격 대비 상승 빨강(▲) / 하락 파랑(▼)
      var pxCls = "", pxArrow = "";
      if (r.basePrice != null && r.lastPrice != null && r.lastPrice !== r.basePrice) {
        var priceUp = r.lastPrice > r.basePrice;
        pxCls = priceUp ? " kr-up" : " kr-down";
        pxArrow = priceUp ? "▲ " : "▼ ";
      }
      return "<tr>" +
        '<td><span class="nm">' + esc(r.name) + '</span><br><span class="tk">' + esc(r.ticker) + "</span></td>" +
        "<td>" + (thm.emoji ? esc(thm.emoji) + " " : "") + esc(thm.label) + "</td>" +
        '<td><span class="mini-dot" style="background:' + tm.color + '"></span>' + r.tier + "</td>" +
        '<td class="num">' + esc(r.since) + "</td>" +
        '<td class="num">' + fmtPrice(r.basePrice, country) + "</td>" +
        '<td class="num' + pxCls + '">' + pxArrow + fmtPrice(r.lastPrice, country) + "</td>" +
        '<td class="num ' + retCls + '">' + (r.ret == null ? "기록 중" : fmtPct(r.ret)) + "</td>" +
        '<td class="num ' + alCls + '">' + (r.alpha == null ? "–" : fmtPct(r.alpha)) + "</td></tr>";
    }).join("");
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      '<th>종목</th><th>주제</th><th>Tier</th><th class="num">첫 기록일</th><th class="num">기록시 가격</th>' +
      '<th class="num">최신 가격</th><th class="num">수익률</th><th class="num">시장 대비</th>' +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
    return html;

    function pTile(k, v, up) {
      return '<div class="tile"><div class="k">' + esc(k) + '</div><div class="v' + (up ? " up" : "") + '">' + v + "</div></div>";
    }
  }

  function render() {
    var host = document.getElementById("cards");
    var descEl = document.getElementById("themeDesc");
    var list;

    if (state.view === "perf") {
      descEl.innerHTML = "<strong>성과 추적</strong> — 추천 시점 대비 실제 수익률 · 기록 " +
        H.length + "일치" + (H.length ? " (" + esc(H[0].date) + " ~ " + esc(H[H.length - 1].date) + ")" : "");
      host.innerHTML = perfView(state.country);
      return;
    }

    var tmeta = themeMeta(state.theme);
    descEl.innerHTML =
      "<strong>" + (tmeta.emoji ? esc(tmeta.emoji) + " " : "") + esc(tmeta.label) + "</strong> — " + esc(tmeta.desc || "");

    list = (D[state.country] || []).filter(function (s) { return s.theme === state.theme; });
    if (!list.length) {
      host.innerHTML = '<div class="empty">해당 주제의 종목이 아직 없습니다.</div>';
      return;
    }

    if (state.view === "table") {
      host.innerHTML = tableView(sortList(list), false);
      ensureLive(list, render);
      return;
    }

    if (state.sort !== "tier") {
      // 티어 그룹 없이 선택한 기준으로 평면 정렬
      host.innerHTML = '<div class="grid">' +
        sortList(list).map(function (s) { return card(s, state.country); }).join("") + "</div>";
      ensureLive(list, render);
      return;
    }

    var html = "";
    [1, 2, 3].forEach(function (t) {
      var group = list.filter(function (s) { return s.tier === t; })
                      .sort(function (a, b) { return numOr(b.upside, -Infinity) - numOr(a.upside, -Infinity); });
      if (!group.length) return;
      var tm = tierMeta(t);
      html += '<div class="tier-group"><div class="tier-head">' +
              '<span class="dot" style="background:' + tm.color + '"></span>' + esc(tm.label) +
              ' <span class="tier-n">' + group.length + "종목</span></div>" +
              '<div class="grid">' + group.map(function (s) { return card(s, state.country); }).join("") + "</div></div>";
    });
    host.innerHTML = html;
    ensureLive(list, render);
  }

  document.getElementById("countrySeg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.country = b.dataset.c;
    this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
    renderTopPicks();
    render();
  });
  document.getElementById("themeChips").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.theme = b.dataset.theme;
    this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
    render();
  });
  document.getElementById("viewSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.view = b.dataset.v;
    this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
    render();
  });

  function renderLiquidity() {
    var box = document.getElementById("liqBox");
    if (!L || (L.us && L.us.shortTerm == null && L.korea && L.korea.shortTerm == null)) return;
    box.style.display = "";

    var RANKS = ["매우 부정", "부정", "신중", "우호", "매우 우호"];
    var RANK_COLORS = ["var(--down)", "#eb6834", "var(--tier3)", "var(--tier2)", "var(--up)"];

    function gauge(rank) {
      var idx = RANKS.indexOf(rank);
      var cells = RANKS.map(function (_, i) {
        var on = idx >= 0 && i <= idx;
        return '<div class="seg5"' + (on ? ' style="background:' + RANK_COLORS[idx] + '"' : "") + "></div>";
      }).join("");
      return '<div class="gauge">' + cells + "</div>";
    }
    function termRow(label, rank) {
      var idx = RANKS.indexOf(rank);
      var color = idx >= 0 ? RANK_COLORS[idx] : "var(--muted)";
      return '<div class="liq-term"><span class="lbl">' + label + "</span>" +
             gauge(rank) +
             '<span class="rank" style="color:' + color + '">' + esc(rank || "–") + "</span></div>";
    }
    function col(flag, title, c) {
      if (!c) return "";
      var drivers = (c.drivers || []).map(function (d) { return "<li>" + esc(d) + "</li>"; }).join("");
      return '<div class="liq-col"><h3>' + flag + " " + title + "</h3>" +
             termRow("단기 1–3M", c.shortTerm) +
             termRow("중기 6–12M", c.midTerm) +
             (drivers ? '<ul class="liq-drivers">' + drivers + "</ul>" : "") +
             "</div>";
    }

    document.getElementById("liqAs").textContent = "기준일 " + esc(L.asOf);
    document.getElementById("liqHeadline").innerHTML = "<strong>" + esc(L.headline) + "</strong>";
    document.getElementById("liqGrid").innerHTML =
      col("🇺🇸", "미국", L.us) + col("🇰🇷", "한국", L.korea);
    var srcs = (L.sources || []).slice(0, 3).map(function (u, i) {
      return '<a href="' + esc(u) + '" target="_blank" rel="noopener">출처' + (i + 1) + "</a>";
    }).join(" ");
    document.getElementById("liqFoot").innerHTML =
      (L.nextCheck ? '<span class="nc">🔔 다음 체크 — ' + esc(L.nextCheck) + "</span> " : "") + srcs;
  }

  renderLiquidity();
  renderThemeChips();
  renderTopPicks();
  render();

  // PWA 서비스워커 등록 (http/https에서만 — file:// 로 열면 건너뜀)
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>

<style>
:root {
  --page:        #f5f5f3;
  --surface:     #ffffff;
  --surface-2:   #ececea;
  --ink:         #14140f;
  --ink-2:       #56554f;
  --muted:       #9a988f;
  --line:        rgba(20,20,15,0.09);
  --grid:        #e8e7e2;
  --accent:      #3a63e0;
  --tier1:       #3466e0;
  --tier2:       #12a150;
  --tier3:       #d99320;
  --up:          #0f8a3c;
  --down:        #d0392f;
  --meter-track: #ececea;
  --meter-lo:    #a8c0ff;
  --meter-hi:    #3466e0;
  --chip-bg:     #ececeac9;
  --kr-up:       #d0392f;
  --kr-down:     #2560c8;
  --bar:         rgba(255,255,255,0.72);
  --shadow-sm:   0 1px 2px rgba(20,20,15,0.05);
  --shadow-lg:   0 8px 28px rgba(20,20,15,0.10);
  --r:           16px;
}
:root[data-theme="dark"] {
  --page:        #0a0a0a;
  --surface:     #161615;
  --surface-2:   #242422;
  --ink:         #f5f5f1;
  --ink-2:       #b8b7ad;
  --muted:       #7f7e76;
  --line:        rgba(255,255,255,0.10);
  --grid:        #2a2a27;
  --accent:      #6f92f5;
  --tier1:       #5b86f0;
  --tier2:       #23b365;
  --tier3:       #e0a53a;
  --up:          #2fb457;
  --down:        #e8635a;
  --meter-track: #2a2a27;
  --meter-lo:    #39508f;
  --meter-hi:    #5b86f0;
  --chip-bg:     #26261f;
  --kr-up:       #e8635a;
  --kr-down:     #5f92ea;
  --bar:         rgba(14,14,13,0.72);
  --shadow-sm:   0 1px 2px rgba(0,0,0,0.3);
  --shadow-lg:   0 8px 28px rgba(0,0,0,0.45);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page:        #0a0a0a;
    --surface:     #161615;
    --surface-2:   #242422;
    --ink:         #f5f5f1;
    --ink-2:       #b8b7ad;
    --muted:       #7f7e76;
    --line:        rgba(255,255,255,0.10);
    --grid:        #2a2a27;
    --accent:      #6f92f5;
    --tier1:       #5b86f0;
    --tier2:       #23b365;
    --tier3:       #e0a53a;
    --up:          #2fb457;
    --down:        #e8635a;
    --meter-track: #2a2a27;
    --meter-lo:    #39508f;
    --meter-hi:    #5b86f0;
    --chip-bg:     #26261f;
    --kr-up:       #e8635a;
    --kr-down:     #5f92ea;
    --bar:         rgba(14,14,13,0.72);
    --shadow-sm:   0 1px 2px rgba(0,0,0,0.3);
    --shadow-lg:   0 8px 28px rgba(0,0,0,0.45);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; }
::selection { background: color-mix(in srgb, var(--accent) 22%, transparent); }

/* ── 상단 바 ── */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--bar);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 1080px; margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 7px; font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em; }
.brand .fl { font-size: 1.02rem; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.gen-date { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
.icon-btn {
  width: 34px; height: 34px; display: grid; place-items: center;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  border-radius: 10px; font-size: 0.95rem; cursor: pointer; transition: background .15s, border-color .15s;
}
.icon-btn:hover { background: var(--surface-2); }
.sim-link { display: inline-flex; line-height: 0; text-decoration: none; }
.sim-link img { width: 34px; height: 34px; border-radius: 10px; background: #fff; display: block; border: 1px solid var(--line); transition: border-color .15s; }
.sim-link:hover img { border-color: var(--tier3); }

.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 72px; }

/* ── 시황 리드 ── */
.market-note { font-size: 0.95rem; color: var(--ink-2); line-height: 1.65; margin: 4px 0 24px; }
.upd-status { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 0.76rem; color: var(--muted); margin: 2px 0 16px; }
.upd-status a { color: var(--ink-2); }
.us-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
.us-gray { background: var(--muted); }
.us-yellow { background: #e0a020; }
.us-amber { background: #eb6834; }
.us-green { background: var(--up); }
.mn-tag {
  display: inline-block; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.03em;
  color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
  padding: 2px 8px; border-radius: 6px; margin-right: 9px; vertical-align: 1px;
}

/* ── 통계 타일 ── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 0 0 24px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.tile .k { color: var(--muted); font-size: 0.74rem; margin-bottom: 5px; }
.tile .v { font-size: 1.4rem; font-weight: 750; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.tile .v.up { color: var(--up); }

/* ── 선택 메뉴 패널 ── */
.menu { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 22px; box-shadow: var(--shadow-sm); overflow: hidden; }
.menu-row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
.menu-row + .menu-row { border-top: 1px solid var(--line); }
.menu-row-theme { align-items: flex-start; }
.menu-lbl { color: var(--muted); font-size: 0.76rem; font-weight: 600; min-width: 32px; flex-shrink: 0; }
.menu-row-theme .menu-lbl { padding-top: 7px; }

/* ── 세그먼트 · 칩 ── */
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 12px; }
.seg button {
  border: 0; background: transparent; color: var(--ink-2); padding: 6px 15px;
  font-size: 0.88rem; font-weight: 600; border-radius: 9px; cursor: pointer; transition: background .15s, color .15s;
}
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 6px 13px; font-size: 0.83rem; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: background .15s, color .15s, border-color .15s;
}
.chip:hover { border-color: color-mix(in srgb, var(--ink) 22%, transparent); }
.chip.on { background: var(--ink); color: var(--page); border-color: var(--ink); }

/* ── Top Picks ── */
.picks { margin: 0 0 26px; }
.picks-head { margin-bottom: 12px; }
.picks-head h2 { font-size: 1.05rem; font-weight: 750; letter-spacing: -0.02em; }
.picks-head .crit { display: block; color: var(--muted); font-size: 0.78rem; margin-top: 3px; }
.picks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.pick {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; position: relative; cursor: pointer;
  transition: transform .16s ease, box-shadow .16s ease;
}
.pick:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

/* Top Pick 클릭 시 대상 카드 강조 */
.card.flash { animation: cardflash 1.8s ease; }
@keyframes cardflash {
  0%, 22%   { box-shadow: 0 0 0 3px var(--accent), var(--shadow-lg); border-color: var(--accent); }
  100%      { box-shadow: 0 0 0 0 transparent, var(--shadow-sm); border-color: var(--line); }
}
.pick .rank { position: absolute; top: 11px; right: 13px; font-size: 1.05rem; }
.pick .thm { display: inline-flex; align-items: center; gap: 4px; font-size: 0.71rem; color: var(--ink-2);
  background: var(--chip-bg); border-radius: 999px; padding: 3px 9px; width: fit-content; }
.pick .nm { font-weight: 700; font-size: 0.98rem; }
.pick .nm .tk { color: var(--muted); font-weight: 400; font-size: 0.75rem; margin-left: 5px; }
.pick .up-big { font-size: 1.35rem; font-weight: 800; color: var(--up); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.pick .sub { color: var(--ink-2); font-size: 0.8rem; }

/* ── 종목 변경(편입·제외) ── */
.roster { margin: 0 0 26px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow-sm); }
.roster-head { margin-bottom: 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.roster-head h2 { font-size: 1.02rem; font-weight: 750; letter-spacing: -0.02em; }
.roster-head .crit { display: block; color: var(--muted); font-size: 0.78rem; margin-top: 3px; }
.roster-date { flex-shrink: 0; font: inherit; font-size: 0.82rem; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; cursor: pointer; max-width: 100%; }
.roster-date:focus { outline: none; border-color: var(--accent); }
.roster-empty { color: var(--muted); font-size: 0.85rem; }
.roster-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(258px, 1fr)); gap: 12px; }
.roster-theme { border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; }
.rth-head { font-size: 0.85rem; font-weight: 750; letter-spacing: -0.01em; margin-bottom: 7px;
  display: flex; align-items: center; gap: 6px; }
.rth-cnt { margin-left: auto; color: var(--muted); font-weight: 600; font-size: 0.72rem; font-variant-numeric: tabular-nums; }
.roster-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 8px; font-size: 0.85rem; }
.roster-line + .roster-line { margin-top: 5px; }
.roster-line .rl-lead { font-weight: 700; font-size: 0.72rem; flex-shrink: 0; }
.roster-line.in  .rl-lead { color: var(--up); }
.roster-line.out .rl-lead { color: var(--down); }
.roster-list { display: inline-flex; flex-wrap: wrap; gap: 4px 9px; }
.roster-item { display: inline-flex; align-items: baseline; gap: 3px; }
.roster-item .rt-nm { font-weight: 600; }
.roster-item .rt-meta { color: var(--muted); font-size: 0.72rem; }
.roster-item.out .rt-nm { text-decoration: line-through; opacity: 0.72; }
/* 카드의 신규 편입 배지 */
.new-badge { display: inline-flex; align-items: center; font-size: 0.66rem; font-weight: 800;
  letter-spacing: 0.02em; color: #fff; background: var(--up); border-radius: 999px; padding: 2px 7px; }

/* ── 툴바 ── */

/* ── 주제 설명 ── */
.theme-desc {
  color: var(--ink-2); font-size: 0.9rem; line-height: 1.65; margin: 2px 0 18px;
  padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.theme-desc strong { color: var(--ink); }

/* ── 티어 그룹 ── */
.tier-group { margin-bottom: 26px; }
.tier-head {
  display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.92rem;
  margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--grid);
}
.tier-head .dot { width: 9px; height: 9px; border-radius: 50%; }
.tier-head .tier-n { color: var(--muted); font-weight: 400; font-size: 0.8rem; }

/* AI 적정가 근거 팝업 — 데스크톱 호버(title)와 별개로 탭/클릭으로 표시 */
.tip-pop {
  position: fixed; z-index: 90; max-width: min(340px, calc(100vw - 24px)); max-height: 45vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg);
  padding: 11px 13px; font-size: 0.8rem; line-height: 1.55; color: var(--ink-2);
}

/* ── 카드 ── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 18px 20px; display: flex; flex-direction: column; gap: 11px; box-shadow: var(--shadow-sm);
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--ink) 12%, transparent); }
.card .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card h3 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
.card .tk { color: var(--muted); font-size: 0.76rem; font-weight: 400; margin-left: 5px; }
.badge {
  font-size: 0.7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  background: var(--chip-bg); color: var(--ink-2);
}
.badge .dot { width: 8px; height: 8px; border-radius: 50%; }
.badges { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

.prices { display: flex; gap: 20px; flex-wrap: wrap; }
.pv .k { color: var(--muted); font-size: 0.72rem; }
.pv .v { font-size: 1.02rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.pv .v.up { color: var(--up); }
.pv .v.down { color: var(--down); }

.meter { height: 6px; border-radius: 4px; background: var(--meter-track); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--meter-lo), var(--meter-hi)); }
.meter-row { display: flex; align-items: center; gap: 10px; }
.meter-row .meter { flex: 1; }
.meter-row .pct { font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; }
.meter-row .pct.up { color: var(--up); }
.meter-row .pct.down { color: var(--down); }

.earn { color: var(--ink-2); font-size: 0.84rem; line-height: 1.55; border-left: 3px solid var(--grid); padding-left: 11px; }
.thesis { font-size: 0.9rem; line-height: 1.6; }
.risks { color: var(--ink-2); font-size: 0.84rem; line-height: 1.55; }
.risks b { color: var(--ink); font-weight: 600; }
.links { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: auto; padding-top: 4px; }
.links a { color: var(--accent); font-size: 0.84rem; font-weight: 500; text-decoration: none; }
.links a:hover { text-decoration: underline; }
.src { color: var(--muted); font-size: 0.75rem; }
.src a { color: var(--muted); }

.warn-badge { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--ink-2); white-space: nowrap; }
.stale { color: var(--tier3); font-weight: 600; }
.live-tag { color: var(--up); font-weight: 700; }

/* 기술분석 신호 */
.tech-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 1px 0 1px; }
.tech-row .tlabel { color: var(--muted); font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
.tech-sig { font-size: 0.74rem; font-weight: 800; padding: 3px 10px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; cursor: help; }
.tech-sig .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.tech-sig.buy2 { color: #fff; background: var(--up); }
.tech-sig.buy1 { color: var(--up); background: var(--chip-bg); }
.tech-sig.hold { color: var(--ink-2); background: var(--chip-bg); }
.tech-sig.sell1 { color: var(--down); background: var(--chip-bg); }
.tech-sig.sell2 { color: #fff; background: var(--down); }
.tech-sig.na { color: var(--muted); background: var(--chip-bg); }
.tech-ind { color: var(--muted); font-size: 0.74rem; font-variant-numeric: tabular-nums; }
.tech-conf { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  cursor: help; color: var(--ink-2); background: var(--chip-bg); font-variant-numeric: tabular-nums; }
.cross-chip { font-size: 0.7rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; white-space: nowrap; cursor: help; }
.cross-chip.gc { color: var(--up); background: var(--chip-bg); }
.cross-chip.dc { color: var(--down); background: var(--chip-bg); }
.tbl .sig-cell .cx { font-weight: 900; margin-left: 3px; }
.tbl .sig-cell .cx.gc { color: var(--up); } .tbl .sig-cell .cx.dc { color: var(--down); }
.tbl .sig-cell { font-size: 0.72rem; font-weight: 800; white-space: nowrap; }
.tbl .sig-cell.buy2 { color: var(--up); } .tbl .sig-cell.buy1 { color: var(--up); }
.tbl .sig-cell.hold { color: var(--ink-2); } .tbl .sig-cell.na { color: var(--muted); }
.tbl .sig-cell.sell1 { color: var(--down); } .tbl .sig-cell.sell2 { color: var(--down); }

.empty { color: var(--muted); padding: 48px 0; text-align: center; }

/* ── 표 ── */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 0.86rem; min-width: 760px; }
.tbl th {
  text-align: left; color: var(--muted); font-weight: 600; font-size: 0.74rem;
  padding: 11px 13px; border-bottom: 1px solid var(--grid); white-space: nowrap; cursor: pointer; user-select: none;
}
.tbl th.num, .tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td { padding: 10px 13px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl .nm { font-weight: 600; }
.tbl .tk { color: var(--muted); font-size: 0.75rem; }
.tbl .up { color: var(--up); font-weight: 700; }
.tbl .down { color: var(--down); font-weight: 700; }
.tbl .kr-up { color: var(--kr-up); font-weight: 700; }
.tbl .kr-down { color: var(--kr-down); font-weight: 700; }
.tbl a { color: var(--accent); text-decoration: none; }
.tbl .mini-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }

/* ── 유동성 게이지 ── */
.liq { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin-bottom: 22px; }
.liq .liq-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.liq .liq-head h2 { font-size: 1.02rem; font-weight: 750; letter-spacing: -0.01em; }
.liq .liq-head-r { display: flex; align-items: center; gap: 10px; }
.liq .liq-as { color: var(--muted); font-size: 0.78rem; }
.liq-refresh { font-size: 0.75rem; font-weight: 700; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; text-decoration: none; white-space: nowrap; }
.liq-refresh:hover { background: var(--meter-track); }
.liq .liq-headline { font-size: 0.94rem; color: var(--ink); line-height: 1.6; margin-bottom: 16px; }
.liq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 620px) { .liq-grid { grid-template-columns: 1fr; } }
.liq-col { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.liq-col h3 { font-size: 0.92rem; font-weight: 700; margin-bottom: 12px; }
.liq-term { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.liq-term .lbl { color: var(--muted); font-size: 0.78rem; min-width: 72px; }
.gauge { display: flex; gap: 4px; flex: 1; }
.gauge .seg5 { flex: 1; height: 8px; border-radius: 4px; background: var(--meter-track); }
.liq-term .rank { font-size: 0.82rem; font-weight: 700; min-width: 64px; text-align: right; }
.liq-drivers { margin: 10px 0 0; padding-left: 16px; }
.liq-drivers li { font-size: 0.82rem; color: var(--ink-2); margin-bottom: 4px; line-height: 1.5; }
.liq-foot { color: var(--muted); font-size: 0.78rem; margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.liq-foot .nc { color: var(--ink-2); }
.liq-foot a { color: var(--muted); }

footer.site { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--grid); color: var(--muted); font-size: 0.8rem; line-height: 1.6; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="fl">🔥</span> 주식 추천</div>
    <div class="top-actions">
      <span class="gen-date" id="genDate"></span>
      <button class="icon-btn" id="themeBtn" type="button" title="라이트·다크 전환" aria-label="테마 전환">🌓</button>
      <a class="sim-link" href="https://csy870617.github.io/TradingSimulator/" target="_blank" rel="noopener" title="트레이딩 시뮬레이터 열기">
        <img src="icon2.png" alt="트레이딩 시뮬레이터">
      </a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="upd-status" id="updStatus" hidden></div>
  <div class="market-note" id="marketNote"></div>

  <div class="liq" id="liqBox" style="display:none">
    <div class="liq-head">
      <h2>거시 유동성</h2>
      <span class="liq-as" id="liqAs"></span>
    </div>
    <div class="liq-headline" id="liqHeadline"></div>
    <div class="liq-grid" id="liqGrid"></div>
    <div class="liq-foot" id="liqFoot"></div>
  </div>

  <section class="picks" id="picksBox" style="display:none">
    <div class="picks-head">
      <h2>오늘의 Top Picks</h2>
      <span class="crit">상승여력·리스크·배당·컨센서스 근거를 종합한 최우선 종목</span>
    </div>
    <div class="picks-grid" id="picksGrid"></div>
  </section>

  <section class="roster" id="rosterBox" style="display:none">
    <div class="roster-head">
      <div class="roster-title"><h2>📌 종목 변경</h2><span class="crit" id="rosterWhen"></span></div>
      <select class="roster-date" id="rosterDate" aria-label="변경 날짜 선택"></select>
    </div>
    <div class="roster-body" id="rosterBody"></div>
  </section>

  <div class="menu">
    <div class="menu-row">
      <span class="menu-lbl">국가</span>
      <div class="seg" id="countrySeg">
        <button data-c="korea" class="on" type="button">🇰🇷 한국</button>
        <button data-c="us" type="button">🇺🇸 미국</button>
      </div>
    </div>
    <div class="menu-row">
      <span class="menu-lbl">보기</span>
      <div class="seg" id="viewSeg">
        <button data-v="cards" class="on" type="button">카드</button>
        <button data-v="table" type="button">표</button>
        <button data-v="perf" type="button">성과</button>
      </div>
    </div>
    <div class="menu-row menu-row-theme">
      <span class="menu-lbl">주제</span>
      <div class="chips" id="themeChips"></div>
    </div>
  </div>

  <div class="theme-desc" id="themeDesc"></div>

  <div id="cards"></div>

  <footer class="site">
    <p id="disclaimer"></p>
    <p style="margin-top:6px;">매일 오전 2시(LA) 자동 갱신 · 현재가 🟢는 실시간 시세</p>
  </footer>
</div>

<script src="data/config.js"></script>
<script src="data/liquidity.js"></script>
<script src="data/recommendations.js"></script>
<script src="data/quotes.js"></script>
<script src="data/history.js"></script>
<script>
(function () {
  var D = window.STOCK_DATA;
  var L = window.LIQUIDITY_DATA;
  // 히스토리는 매일 스크립트가 새로 쓰므로, 한 번의 불완전 기록이 페이지 전체를 막지 않도록
  // 유효한 스냅샷(date 문자열 + stocks 배열)만 사용한다.
  var H = (window.STOCK_HISTORY || [])
    .filter(function (s) { return s && typeof s.date === "string" && Array.isArray(s.stocks); })
    .sort(function (a, b) { return a.date.localeCompare(b.date); });

  // ── 종목 변경(편입·제외) 계산 — 인접 스냅샷쌍마다 diff 축적(history.js) ──
  // 날짜별로 편입/제외를 조회할 수 있도록, 각 스냅샷을 직전 스냅샷과 비교해 기록한다.
  var NEW_TICKERS = {};    // 가장 최근 갱신에 새로 편입된 티커 → true (카드 NEW 배지용)
  var ROSTER_HIST = [];    // [{date, prevDate, added:[snapStock], removed:[snapStock]}], 과거→최신
  (function computeRoster() {
    for (var i = 1; i < H.length; i++) {
      var prev = H[i - 1], cur = H[i];
      var prevSet = {}, curSet = {};
      prev.stocks.forEach(function (s) { prevSet[s.t] = s; });
      cur.stocks.forEach(function (s) { curSet[s.t] = s; });
      var added = cur.stocks.filter(function (s) { return !prevSet[s.t]; });
      var removed = prev.stocks.filter(function (s) { return !curSet[s.t]; });
      ROSTER_HIST.push({ date: cur.date, prevDate: prev.date, added: added, removed: removed });
    }
    // NEW 배지: 가장 최근 스냅샷의 편입 종목
    if (ROSTER_HIST.length) {
      ROSTER_HIST[ROSTER_HIST.length - 1].added.forEach(function (s) { NEW_TICKERS[s.t] = true; });
    }
  })();

  var state = {
    country: "korea",
    theme: (D && D.themes && D.themes[0] && D.themes[0].key) || "core",
    view: "cards"
  };

  var root = document.documentElement;
  document.getElementById("themeBtn").addEventListener("click", function () {
    var cur = root.getAttribute("data-theme");
    var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    var effective = cur || (prefersDark ? "dark" : "light");
    root.setAttribute("data-theme", effective === "dark" ? "light" : "dark");
  });

  if (!D) {
    document.getElementById("cards").innerHTML =
      '<div class="empty">data/recommendations.js 를 불러오지 못했습니다.</div>';
    return;
  }

  // ── 시세 스냅샷 병합 (data/quotes.js, LLM 토큰 0으로 매일 갱신되는 레이어) ──
  // 분석(recommendations.js)에서 시세를 분리했으므로, 저장된 종가 대신 quotes.js 값을
  // 각 종목의 기본 시세로 덮어쓴다. 상승여력은 목표가(컨센서스) 기준으로 재계산한다.
  // quotes.js 에 없는 종목(예: 방금 추가된 종목)은 recommendations.js 종가를 그대로 폴백.
  (function applyQuotes() {
    var Q = (window.STOCK_QUOTES && window.STOCK_QUOTES.quotes) || null;
    if (!Q) return;
    ["korea", "us"].forEach(function (c) {
      (D[c] || []).forEach(function (s) {
        var q = s && Q[s.ticker];
        if (!q || typeof q.price !== "number" || !isFinite(q.price)) return;
        s.price = q.price;
        s.priceUnverified = false; // 실제 시세 확보 → '현재가 확인 필요' 마크 해제
        s.priceDate = q.date || s.priceDate;
        s.upside = (s.targetPrice != null && q.price)
          ? (s.targetPrice - q.price) / q.price * 100 : s.upside;
      });
    });
  })();

  document.getElementById("genDate").textContent = "기준일 " + D.generatedAt;

  // 업데이트 진행 상태 칩 — GitHub 공개 API로 최근 '업데이트 요청' 이슈 상태를 읽어 표시(토큰 불필요).
  // 실패(오프라인·요청 제한)하면 데이터 기준일만 조용히 표시한다.
  (function () {
    var el = document.getElementById("updStatus");
    if (!el) return;
    var liqD = (window.LIQUIDITY_DATA && window.LIQUIDITY_DATA.asOf) || "";
    var base = "데이터 기준 분석 " + D.generatedAt + (liqD ? " · 유동성 " + liqD : "");
    function show(dot, txt, link) {
      el.innerHTML = '<span class="us-dot ' + dot + '"></span><span>' + txt + (link || "") + " · " + esc(base) + "</span>";
      el.hidden = false;
    }
    show("us-gray", "상태 확인 중…");   // 기본(조회 전/실패 시 유지)
    fetch("https://api.github.com/repos/csy870617/stock/issues?state=all&per_page=15&sort=created&direction=desc",
      { headers: { "Accept": "application/vnd.github+json" } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (list) {
        if (!Array.isArray(list)) { show("us-gray", "최근 업데이트"); return; }
        var reqs = list.filter(function (it) {
          return !it.pull_request && it.title && it.title.indexOf("업데이트 요청") >= 0;
        });
        if (!reqs.length) { show("us-gray", "최근 업데이트"); return; }
        var it = reqs[0];
        var link = ' · <a href="' + esc(it.html_url) + '" target="_blank" rel="noopener">#' + it.number + "</a>";
        if (it.state === "open" && it.comments > 0) show("us-amber", "🔧 업데이트 처리 중", link);
        else if (it.state === "open") show("us-yellow", "🟡 업데이트 요청 접수됨 — 처리 대기중", link);
        else show("us-green", "🟢 최근 업데이트 완료", link);
      })
      .catch(function () { show("us-gray", "최근 업데이트"); });
  })();

  document.getElementById("marketNote").innerHTML =
    '<span class="mn-tag">시황</span>' + esc(D.marketNote);
  document.getElementById("disclaimer").textContent = D.disclaimer;

  // AI 적정가 근거 팝업 — 터치 기기에선 title 툴팁이 안 뜨므로 탭/클릭으로 표시(다시 탭하거나 바깥 탭하면 닫힘)
  (function () {
    var pop = document.createElement("div");
    pop.className = "tip-pop"; pop.hidden = true;
    document.body.appendChild(pop);
    document.addEventListener("click", function (ev) {
      var el = ev.target.closest ? ev.target.closest("[data-basis]") : null;
      if (el && el.getAttribute("data-basis")) {
        if (!pop.hidden && pop._src === el) { pop.hidden = true; pop._src = null; return; }
        pop.textContent = el.getAttribute("data-basis");
        pop.hidden = false; pop._src = el;
        var r = el.getBoundingClientRect();
        var top = r.bottom + 8;
        pop.style.left = Math.max(12, Math.min(r.left, window.innerWidth - pop.offsetWidth - 12)) + "px";
        if (top + pop.offsetHeight > window.innerHeight - 10) top = Math.max(10, r.top - pop.offsetHeight - 8);
        pop.style.top = top + "px";
      } else if (!pop.hidden) { pop.hidden = true; pop._src = null; }
    });
    window.addEventListener("scroll", function () { if (!pop.hidden) { pop.hidden = true; pop._src = null; } }, { passive: true });
  })();

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  // AI 적정가 미산출 종목의 보류 사유 문구 (탭/호버 팝업용)
  function aiPendingText(s) {
    var why = s.aiPending || "입력값(2026E EPS·배당) 검증이 아직 완료되지 않았습니다";
    return "AI 적정가 추정중 — " + why + ". 매 업데이트마다 재검증해 산출되는 대로 표시됩니다.";
  }
  function fmtPrice(v, country) {
    if (v == null) return "–";
    return country === "korea"
      ? "₩" + Math.round(v).toLocaleString("ko-KR")
      : "$" + Number(v).toLocaleString("en-US", { maximumFractionDigits: 2 });
  }
  function fmtPct(v) {
    if (v == null) return "–";
    return (v > 0 ? "+" : "") + Number(v).toFixed(1) + "%";
  }
  // 정렬용: 값이 없거나 숫자가 아니면 기본값 반환 (0을 -999 로 오인하지 않도록)
  function numOr(v, def) { return (typeof v === "number" && !isNaN(v)) ? v : def; }
  var TIER_COLORS = { 1: "var(--tier1)", 2: "var(--tier2)", 3: "var(--tier3)" };
  var TIER_NAMES = { 1: "Tier 1 · 최우선", 2: "Tier 2 · 차선", 3: "Tier 3 · 관심" };
  function tierMeta(t) {
    return { label: TIER_NAMES[t] || "Tier ?", color: TIER_COLORS[t] || "var(--muted)" };
  }
  function themeMeta(key) {
    var t = (D.themes || []).filter(function (x) { return x.key === key; })[0];
    return t || { key: key, label: key, emoji: "", desc: "" };
  }

  // 시세(quotes.js)는 매일 갱신되므로 최신성은 "오늘" 대비로 판단한다.
  function staleDays(s) {
    if (!s.priceDate) return 0;
    var d = (Date.now() - new Date(s.priceDate)) / 86400000;
    return isNaN(d) || d < 0 ? 0 : Math.round(d);
  }

  // ── 실시간 가격 레이어 (전용 시세 서버 경유 Yahoo 시세) ──
  // data/config.js 의 quotesApi 로 배치 조회한다. 서버가 CORS 헤더를 붙여 돌려주므로
  // 브라우저 CORS 문제가 없다. 미설정·조회 실패 시 조용히 스냅샷(기존 종가)으로 폴백.
  var QUOTES_API = ((window.APP_CONFIG && window.APP_CONFIG.quotesApi) || "").replace(/\/+$/, "");
  var liveCache = {};     // ticker → {price, date} | null(응답에 없음) | undefined(미조회)
  var liveInflight = {};
  var liveSupported = typeof window.fetch === "function" && typeof AbortController === "function" && !!QUOTES_API;

  function symbolFor(s) {
    if (s.market === "KOSPI") return s.ticker + ".KS";
    if (s.market === "KOSDAQ") return s.ticker + ".KQ";
    return s.ticker === "BRK.B" ? "BRK-B" : s.ticker;   // 미국(NASDAQ/NYSE)
  }

  // 보이는 종목들의 실시간 가격을 (미조회분만) 한 번의 배치 요청으로 가져온 뒤, 하나라도 성공하면 onDone 호출
  function ensureLive(stocks, onDone) {
    if (!liveSupported) return;
    var todo = [], seen = {};
    stocks.forEach(function (s) {
      if (!s || seen[s.ticker]) return;
      seen[s.ticker] = 1;
      if (liveCache[s.ticker] === undefined && !liveInflight[s.ticker]) todo.push(s);
    });
    if (!todo.length) return;
    todo.forEach(function (s) { liveInflight[s.ticker] = 1; });
    var symbols = todo.map(symbolFor);
    var url = QUOTES_API + (QUOTES_API.indexOf("?") >= 0 ? "&" : "?") + "symbols=" + encodeURIComponent(symbols.join(","));
    var ctrl = new AbortController();
    var to = setTimeout(function () { ctrl.abort(); }, 9000);
    fetch(url, { signal: ctrl.signal, cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (map) {
        clearTimeout(to);
        var any = false;
        todo.forEach(function (s) {
          var v = map && map[symbolFor(s)];
          if (v && typeof v.price === "number" && isFinite(v.price)) { liveCache[s.ticker] = { price: v.price, date: v.date }; any = true; }
          else { liveCache[s.ticker] = null; }   // 응답에 없으면 스냅샷 유지
          delete liveInflight[s.ticker];
        });
        if (any && onDone) onDone();
      })
      .catch(function () {
        clearTimeout(to);
        // 네트워크/서버 오류 → 다음 렌더에서 재시도할 수 있도록 미조회 상태로 되돌림
        todo.forEach(function (s) { delete liveInflight[s.ticker]; });
      });
  }

  // 종목의 "표시용" 현재가·상승여력 — 실시간 값이 있으면 그것으로, 없으면 스냅샷으로
  function effective(s) {
    var lv = liveCache[s.ticker];
    if (lv && lv.price != null) {
      var up = (s.targetPrice != null && lv.price) ? (s.targetPrice - lv.price) / lv.price * 100 : s.upside;
      return { price: lv.price, priceDate: lv.date || s.priceDate, upside: up, live: true };
    }
    return { price: s.price, priceDate: s.priceDate, upside: s.upside, live: false };
  }

  // ── 과거 시계열 레이어 (기술분석용 — 신뢰할 만한 기간의 실제 일봉 종가) ──
  // 누적 스냅샷(history.js)만으로는 기간이 짧아 RSI14·MA20·MA50 이 부정확하다.
  // 그래서 시세 서버(config.js 의 quotesApi)의 history 모드로 6개월 일봉 종가를 받아
  // 기술분석에 사용한다(서버가 Yahoo 를 서버-사이드로 조회 → CORS 문제 없음).
  // 서버가 history 를 지원하지 않거나 실패하면 조용히 누적 스냅샷으로 폴백한다.
  var HIST_RANGE = "6mo";
  var histCache = {};      // ticker → closes[](오래된→최신) | null(미지원·실패) | undefined(미조회)
  var histInflight = {};
  function fetchHistory(stocks, onDone) {
    if (!liveSupported) return;   // quotesApi 미설정이면 누적 스냅샷만 사용
    var todo = [], seen = {};
    stocks.forEach(function (s) {
      if (!s || seen[s.ticker]) return; seen[s.ticker] = 1;
      if (histCache[s.ticker] === undefined && !histInflight[s.ticker]) todo.push(s);
    });
    if (!todo.length) return;
    todo = todo.slice(0, 40);     // 한 번에 최대 40종목(서버 부하·지연 관리)
    todo.forEach(function (s) { histInflight[s.ticker] = 1; });
    var symbols = todo.map(symbolFor);
    var url = QUOTES_API + (QUOTES_API.indexOf("?") >= 0 ? "&" : "?") +
      "history=1&range=" + HIST_RANGE + "&symbols=" + encodeURIComponent(symbols.join(","));
    var ctrl = new AbortController();
    var to = setTimeout(function () { ctrl.abort(); }, 15000);
    fetch(url, { signal: ctrl.signal })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (map) {
        clearTimeout(to);
        var any = false;
        todo.forEach(function (s) {
          var v = map && map[symbolFor(s)];
          // history 모드 응답만 채택(closes 배열). 구버전 서버가 시세를 돌려주면 무시하고 폴백.
          if (v && Array.isArray(v.closes) && v.closes.length >= 20) { histCache[s.ticker] = v.closes; any = true; }
          else { histCache[s.ticker] = null; }
          delete histInflight[s.ticker];
        });
        if (any && onDone) onDone();
      })
      .catch(function () {
        clearTimeout(to);
        todo.forEach(function (s) { delete histInflight[s.ticker]; });
      });
  }

  // ── 기술분석 종가 시계열 — 실측 6개월(있으면 우선) > 누적 스냅샷(폴백) ──
  // 외부 차트 API가 막힌 브라우저 대신 시세 서버가 조회한 실제 일봉을 쓰고,
  // 없으면 앱이 매일 기록해온 누적 종가(history.js)를 쓴다.
  // 누적 시계열은 거래일(priceDate) 기준으로 중복(주말·미갱신)을 제거해 실제 흐름만 남긴다.
  var CLOSES = (function () {
    var byDate = {}, order = {};
    H.forEach(function (snap) {
      (snap.stocks || []).forEach(function (x) {
        if (!x || typeof x.p !== "number" || !isFinite(x.p)) return;
        var key = x.pd || snap.date;
        if (!byDate[x.t]) { byDate[x.t] = {}; order[x.t] = []; }
        if (!(key in byDate[x.t])) order[x.t].push(key);
        byDate[x.t][key] = x.p;   // 같은 거래일은 마지막 값으로
      });
    });
    var m = {};
    Object.keys(byDate).forEach(function (t) {
      order[t].sort();
      m[t] = order[t].map(function (k) { return byDate[t][k]; });
    });
    return m;
  })();
  // 기술분석에 쓸 종가 시계열 선택: 실측 6개월(histCache) 우선, 없으면 누적 스냅샷(CLOSES).
  // 반환 {cl(오래된→최신), source:'live'|'accum', n}
  function closeSeries(s) {
    var accum = CLOSES[s.ticker] || [];
    var hist = histCache[s.ticker];
    var cl, source;
    if (Array.isArray(hist) && hist.length >= 2 && hist.length >= accum.length) { cl = hist.slice(); source = "live"; }
    else { cl = accum.slice(); source = "accum"; }
    // 누적 스냅샷은 최신 표시가(실시간/quotes)가 마지막 기록보다 새로우면 반영(실측 시계열은 이미 일봉으로 최신)
    if (source === "accum") {
      var e = effective(s);
      if (e.price != null && isFinite(e.price) && (cl.length === 0 || cl[cl.length - 1] !== e.price)) cl.push(e.price);
    }
    return { cl: cl, source: source, n: cl.length };
  }
  function mean(a) { for (var s = 0, i = 0; i < a.length; i++) s += a[i]; return s / a.length; }
  // Wilder RSI — 초기 period 평균으로 시드한 뒤 지수평활(표준 방식)
  function rsiOf(cl, period) {
    var n = cl.length;
    if (n < 3) return null;
    var p = Math.min(period, n - 1);
    var gain = 0, loss = 0;
    for (var i = 1; i <= p; i++) { var d = cl[i] - cl[i - 1]; if (d >= 0) gain += d; else loss -= d; }
    var ag = gain / p, al = loss / p;
    for (var j = p + 1; j < n; j++) {
      var dd = cl[j] - cl[j - 1];
      ag = (ag * (p - 1) + (dd > 0 ? dd : 0)) / p;
      al = (al * (p - 1) + (dd < 0 ? -dd : 0)) / p;
    }
    if (al === 0) return ag === 0 ? 50 : 100;
    return 100 - 100 / (1 + ag / al);
  }
  // s → {label, short, cls, ind, cross, conf, dir, note}
  function techSignal(s) {
    var cs = closeSeries(s);
    var cl = cs.cl, n = cs.n;
    if (n < 5) return { label: "데이터 축적 중", short: "축적중", cls: "na", ind: "", cross: null, conf: null, dir: 0,
      note: "기술분석은 신뢰할 만한 기간의 일봉 종가가 확보되면 표시됩니다(현재 " + n + "일). 시세 서버 연결 시 6개월 시계열을 받아오고, 없으면 앱이 매일 종가를 누적합니다." };
    var last = cl[n - 1];
    var win = Math.min(20, n), seg = cl.slice(n - win);
    var maMid = mean(seg), hi = Math.max.apply(null, seg), lo = Math.min.apply(null, seg);
    var pos = hi > lo ? (last - lo) / (hi - lo) : 0.5;      // 최근 구간 내 위치 0(저점)~1(고점)
    var rsi = rsiOf(cl, 14);
    var vsMid = (last / maMid - 1) * 100;                    // 20일선(가용분) 대비 %

    // ── 골든/데드 크로스 (단기·장기 이동평균 교차, 최근 3거래일 내 발생분) ──
    // 윈도우는 데이터가 쌓일수록 표준(단기 5·장기 20)으로 수렴하고, 데이터가 적으면
    // 가용 범위에서 축소해 지금도 동작한다(예: 10일치 → 4·8일선).
    var cross = null;   // 'golden' | 'dead' | null
    (function () {
      var lW = Math.min(20, n - 2);
      if (lW < 4) return;
      var sW = Math.min(5, Math.max(2, Math.floor(lW / 2)));
      var maAt = function (end, w) { return mean(cl.slice(end - w, end)); };   // end 직전 w개 평균
      for (var j = 0; j < 3; j++) {
        var iN = n - j, iP = iN - 1;
        if (iP - lW < 0 || iN - sW < 0) break;
        var sN = maAt(iN, sW), lN = maAt(iN, lW), sP = maAt(iP, sW), lP = maAt(iP, lW);
        if (sP <= lP && sN > lN) { cross = "golden"; break; }
        if (sP >= lP && sN < lN) { cross = "dead"; break; }
      }
    })();

    // ── 추세추종 다중 지표 합의 → 방향 + 신뢰도(지표 합치도) ──
    // 같은 철학(추세추종)의 지표들이 서로 교차검증한다. 여러 지표가 일치할수록 신뢰도가 오르고,
    // 강한 신호(적극 매수·차익 실현)는 지표 합치도 90% 이상일 때만 낸다. 신호 신뢰도를 높이기 위함.
    var maFast = mean(cl.slice(Math.max(0, n - Math.min(5, Math.floor(n / 2)))));
    var fastVs = (maFast / maMid - 1) * 100;                              // 단기 이평 vs 중기 이평 %
    var kk = Math.min(5, n - 1);
    var roc = cl[n - 1 - kk] ? (last / cl[n - 1 - kk] - 1) * 100 : 0;      // 최근 모멘텀 %
    var votes = [
      [vsMid >= 1 ? 1 : vsMid <= -1 ? -1 : 0, 1.0],                       // 종가 vs 20일선(추세)
      [fastVs >= 0.3 ? 1 : fastVs <= -0.3 ? -1 : 0, 1.0],                 // 단기 vs 중기 이평(정/역배열)
      [cross === "golden" ? 1 : cross === "dead" ? -1 : 0, 1.2],          // 골든/데드 크로스
      [roc >= 1.5 ? 1 : roc <= -1.5 ? -1 : 0, 0.8],                       // 모멘텀
      [pos >= 0.6 ? 1 : pos <= 0.4 ? -1 : 0, 0.8]                         // 고저 구간 내 위치(추세 강도)
    ];
    var bull = 0, bear = 0, tot = 0;
    votes.forEach(function (v) { tot += v[1]; if (v[0] > 0) bull += v[1]; else if (v[0] < 0) bear += v[1]; });
    var dir = bull > bear ? 1 : bull < bear ? -1 : 0;
    var conf = Math.round(Math.max(bull, bear) / tot * 100);              // 지표 합치도(신뢰도) %
    var rsiFlag = "";                                                     // RSI 과열/과냉 필터(추격 위험 시 신뢰도 상한↓)
    if (rsi != null) {
      if (dir > 0 && rsi >= 75) { conf = Math.min(conf, 80); rsiFlag = "과열"; }
      else if (dir < 0 && rsi <= 25) { conf = Math.min(conf, 80); rsiFlag = "과냉"; }
    }

    var label, short, cls;
    if (dir > 0 && conf >= 90) { label = "적극 매수"; short = "적극매수"; cls = "buy2"; }
    else if (dir > 0 && conf >= 65) { label = "매수"; short = "매수"; cls = "buy1"; }
    else if (dir < 0 && conf >= 90) { label = "차익 실현"; short = "차익"; cls = "sell2"; }
    else if (dir < 0 && conf >= 65) { label = "비중 축소"; short = "축소"; cls = "sell1"; }
    else { label = "관망"; short = "관망"; cls = "hold"; }

    var ind = [];
    if (rsi != null) ind.push("RSI " + Math.round(rsi) + (rsiFlag ? "(" + rsiFlag + ")" : ""));
    ind.push("20일선 " + (vsMid >= 0 ? "+" : "") + vsMid.toFixed(1) + "%");
    ind.push("위치 " + Math.round(pos * 100) + "%");
    ind.push(cs.source === "live" ? n + "일 실측" : n + "일 누적");
    var crossNote = cross === "golden" ? " 최근 골든크로스로 매수 쪽 지표가 가세했습니다."
      : cross === "dead" ? " 최근 데드크로스로 매도 쪽 지표가 가세했습니다." : "";
    var dataNote = cs.source === "live"
      ? "시세 서버에서 받은 실측 일봉 " + n + "거래일치(약 " + HIST_RANGE + ")로 계산해 RSI14·이동평균이 온전합니다."
      : "앱이 누적한 일별 종가 " + n + "거래일치로 계산했습니다(시세 서버 연결 시 6개월 실측 시계열로 자동 강화).";
    var note = "기술분석 — " + dataNote + " "
      + "종가 vs 20일선, 단기·중기 이평 배열, 골든/데드 크로스, 모멘텀, 고저 구간 내 위치 등 "
      + "추세추종 지표 " + votes.length + "개의 합의로 방향을 정하고, 지표가 일치하는 정도를 신뢰도(현재 " + conf + "%)로 표시합니다. "
      + "강한 신호(적극 매수·차익 실현)는 신뢰도 90% 이상일 때만 냅니다." + crossNote
      + " Wilder RSI로 과열·과냉을 걸러냅니다. 투자 판단은 본인 책임입니다.";
    return { label: label, short: short, cls: cls, ind: ind.join(" · "), cross: cross, conf: conf, dir: dir, source: cs.source, note: note };
  }

  // 정렬: Tier 오름차순 → 상승여력 내림차순 (표 뷰에서 사용)
  function sortList(list) {
    return list.slice().sort(function (a, b) {
      return (a.tier - b.tier) || (numOr(b.upside, -Infinity) - numOr(a.upside, -Infinity));
    });
  }

  // 종합 선정 점수 — 단순 상승여력이 아니라 리서치 요소를 가중 합산한다.
  //   · 상승여력(60%에서 만점, 과열 종목이 독점하지 않도록 캡)
  //   · 리스크 개수(적을수록 가점)  · 배당(하방 쿠션)  · 컨센서스 근거(출처 수)
  function pickScore(s) {
    var upScore   = Math.max(0, Math.min(numOr(s.upside, 0), 60)) / 60;
    var divScore  = Math.max(0, Math.min(numOr(s.dividendYield, 0), 6)) / 6;
    var riskScore = 1 - Math.max(0, Math.min(((s.risks || []).length) - 2, 3)) * 0.15;
    var srcScore  = Math.max(0, Math.min((s.sources || []).length, 3)) / 3;
    return 0.48 * upScore + 0.22 * riskScore + 0.18 * divScore + 0.12 * srcScore;
  }

  // 종목 변경(편입·제외) 섹션 — 날짜 드롭다운으로 과거 변경도 조회. 스냅샷쌍이 없으면 숨김.
  function renderRoster() {
    var box = document.getElementById("rosterBox");
    if (!ROSTER_HIST.length) { box.style.display = "none"; return; }
    box.style.display = "";

    var sel = document.getElementById("rosterDate");
    var opts = ROSTER_HIST.slice().reverse();   // 최신 날짜가 위로
    // 기본 선택: 변경이 있는 가장 최신 날짜, 없으면 가장 최신
    var def = null;
    for (var i = 0; i < opts.length; i++) { if (opts[i].added.length || opts[i].removed.length) { def = opts[i]; break; } }
    if (!def) def = opts[0];

    if (!sel.dataset.init) {
      sel.innerHTML = opts.map(function (e) {
        var n = e.added.length + e.removed.length;

        return '<option value="' + esc(e.date) + '"' + (e.date === def.date ? " selected" : "") + ">" + esc(label) + "</option>";
      }).join("");
      sel.addEventListener("change", function () { renderRosterBody(sel.value); });
      sel.dataset.init = "1";
    }
    renderRosterBody(def.date);
  }

  // 선택된 날짜의 편입/제외를 주제별로 묶어서 렌더
  function renderRosterBody(date) {
    var entry = null;
    for (var i = 0; i < ROSTER_HIST.length; i++) { if (ROSTER_HIST[i].date === date) { entry = ROSTER_HIST[i]; break; } }
    if (!entry) return;
    document.getElementById("rosterWhen").textContent = entry.prevDate + " → " + entry.date + " 기준";

    function item(s, cls) {
      var flag = s.c === "us" ? "🇺🇸" : "🇰🇷";
      return '<span class="roster-item ' + cls + '"><span class="rt-nm">' + esc(s.n) + "</span>" +
        '<span class="rt-meta">' + flag + "</span></span>";
    }
    function line(list, cls, lead) {
      if (!list.length) return "";
      return '<div class="roster-line ' + cls + '"><span class="rl-lead">' + lead + "</span>" +
        '<span class="roster-list">' + list.map(function (s) { return item(s, cls); }).join("") + "</span></div>";
    }
    function themeBlock(key, label, emoji) {
      var added = entry.added.filter(function (s) { return s.th === key; });
      var removed = entry.removed.filter(function (s) { return s.th === key; });
      if (!added.length && !removed.length) return "";
      return '<div class="roster-theme"><div class="rth-head">' +
        (emoji ? esc(emoji) + " " : "") + esc(label) +
        '<span class="rth-cnt">🟢' + added.length + " 🔴" + removed.length + "</span></div>" +
        line(added, "in", "편입") + line(removed, "out", "제외") + "</div>";
    }

    var themes = D.themes || [];
    var covered = {};
    var html = themes.map(function (t) { covered[t.key] = 1; return themeBlock(t.key, t.label, t.emoji); }).join("");
    var otherKeys = {};
    entry.added.concat(entry.removed).forEach(function (s) { if (!covered[s.th]) otherKeys[s.th] = 1; });
    Object.keys(otherKeys).forEach(function (k) { html += themeBlock(k, k, ""); });

    document.getElementById("rosterBody").innerHTML =
      html || '<div class="roster-empty">이 날짜에는 편입·제외 변경이 없습니다.</div>';
  }

  function renderTopPicks() {
    var box = document.getElementById("picksBox");
    var seen = {}, picks = [];
    // 최우선(Tier 1) 확신 등급 & (실시간 기준) 목표가 미도달 종목만 후보로
    // — 카드와 동일한 effective() 상승여력으로 판정해, 실시간 시세가 붙어도 표시가 어긋나지 않게 한다.
    (D[state.country] || []).forEach(function (s) {
      if (s.tier !== 1 || seen[s.ticker]) return;
      var up = effective(s).upside;
      if (up == null || up <= 0) return;
      seen[s.ticker] = true; picks.push(s);
    });
    // 종합 점수 내림차순(동점 시 상승여력)
    picks.sort(function (a, b) { return (pickScore(b) - pickScore(a)) || (numOr(b.upside, 0) - numOr(a.upside, 0)); });
    picks = picks.slice(0, 3);
    if (!picks.length) { box.style.display = "none"; return; }
    box.style.display = "";
    document.getElementById("picksGrid").innerHTML = picks.map(function (s, i) {
      var thm = themeMeta(s.theme);
      var e = effective(s);   // 가격·상승여력은 카드와 동일하게 실시간 우선
      return '<div class="pick" data-ticker="' + esc(s.ticker) + '" data-theme="' + esc(s.theme) + '"><span class="rank">' + ["🥇", "🥈", "🥉"][i] + "</span>" +
        '<span class="thm">' + (thm.emoji ? esc(thm.emoji) + " " : "") + esc(thm.label) + " · Tier 1</span>" +
        '<div class="nm">' + esc(s.name) + '<span class="tk">' + esc(s.ticker) + "</span></div>" +
        '<div class="up-big">' + fmtPct(e.upside) + "</div>" +
        '<div class="sub">' + fmtPrice(e.price, state.country) + " → 목표 " + fmtPrice(s.targetPrice, state.country) +
        (s.dividendYield ? " · 배당 " + Number(s.dividendYield).toFixed(1) + "%" : "") + "</div></div>";
    }).join("");
    // 후보들의 실시간 시세도 확보해, 도착하면 카드와 함께 다시 그린다(현재 주제에 없어도).
    ensureLive(picks, refreshLive);
  }

  function tableView(list, showTheme) {
    var rows = list.map(function (s) {
      var e = effective(s);
      var upCls = e.upside == null ? "" : e.upside >= 0 ? "up" : "down";
      var sd = staleDays(s);
      var thm = themeMeta(s.theme);
      var tm = tierMeta(s.tier);
      var dateCell = e.live
        ? '<span class="live-tag" title="실시간">🟢</span>'
        : esc(s.priceDate || "") + (sd >= 7 ? ' <span class="stale">⏳</span>' : "") +
          (s.priceUnverified ? ' <span class="stale" title="현재가 확인 필요 — 옛 가격 기준">⚠</span>' : "");
      return "<tr>" +
        '<td><span class="nm">' + esc(s.name) + '</span><br><span class="tk">' + esc(s.ticker) + " · " + esc(s.market) + "</span></td>" +
        (showTheme ? "<td>" + (thm.emoji ? esc(thm.emoji) + " " : "") + esc(thm.label) + "</td>" : "") +
        '<td><span class="mini-dot" style="background:' + tm.color + '"></span>' + s.tier + "</td>" +
        '<td class="num">' + fmtPrice(e.price, state.country) + "</td>" +
        '<td class="num">' + dateCell + "</td>" +
        '<td class="num">' + fmtPrice(s.targetPrice, state.country) + "</td>" +
        '<td class="num">' + (s.aiTarget != null
          ? '<span title="' + esc(s.aiBasis || "") + '" data-basis="' + esc(s.aiBasis || "") + '" style="cursor:help">🤖 ' + fmtPrice(s.aiTarget, state.country) + "</span>"
          : '<span title="' + esc(aiPendingText(s)) + '" data-basis="' + esc(aiPendingText(s)) + '" style="cursor:help;color:var(--muted)">추정중</span>') + "</td>" +
        '<td class="num ' + upCls + '">' + fmtPct(e.upside) + "</td>" +
        (function () {
          var ts = techSignal(s);
          var cx = ts.cross === "golden" ? '<span class="cx gc" title="골든크로스">✚</span>'
            : ts.cross === "dead" ? '<span class="cx dc" title="데드크로스">✖</span>' : "";
          return '<td class="sig-cell ' + ts.cls + '" title="' + esc(ts.note) + '" data-basis="' + esc(ts.note) + '">' + esc(ts.short) + cx + "</td>";
        })() +
        '<td class="num">' + (s.dividendYield == null ? "–" : Number(s.dividendYield).toFixed(1) + "%") + "</td>" +
        '<td><a href="' + esc(s.chartUrl) + '" target="_blank" rel="noopener">차트</a></td></tr>';
    }).join("");
    return '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      "<th>종목</th>" + (showTheme ? "<th>주제</th>" : "") + "<th>Tier</th><th class=\"num\">현재가</th>" +
      '<th class="num">기준일</th><th class="num">목표가</th><th class="num" title="검증 입력값 기반 자체 분석(참고용)">AI적정가</th><th class="num">상승여력</th><th title="누적 종가 기반 추세추종 다중 지표 합의 신호(합치도 90%+에서만 강한 신호)">기술분석</th><th class="num">배당</th><th>링크</th>' +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
  }

  // ── 성과(추천 능력) 계산: 각 종목의 "첫 기록 시점 대비" 수익률과 시장(벤치마크) 대비 초과수익 ──
  function computePerf(country) {
    if (!H.length) return null;
    var benchKey = country === "korea" ? "kospi" : "sp500";
    var last = H[H.length - 1];
    var firstSeen = {}; // ticker → {snap, entry}
    H.forEach(function (snap) {
      snap.stocks.forEach(function (e) {
        if (e.c !== country) return;
        if (!firstSeen[e.t]) firstSeen[e.t] = { snap: snap, entry: e };
      });
    });
    var rows = [];
    last.stocks.forEach(function (e) {
      if (e.c !== country) return;
      var f = firstSeen[e.t];
      if (!f) return;
      var days = Math.round((new Date(last.date) - new Date(f.snap.date)) / 86400000);
      var ret = (f.entry.p && e.p) ? (e.p - f.entry.p) / f.entry.p * 100 : null;
      var benchRet = (f.snap[benchKey] && last[benchKey])
        ? (last[benchKey] - f.snap[benchKey]) / f.snap[benchKey] * 100 : null;
      rows.push({
        name: e.n, ticker: e.t, theme: e.th, tier: f.entry.tier,
        since: f.snap.date, basePrice: f.entry.p, lastPrice: e.p, days: days,
        ret: days > 0 ? ret : null,
        alpha: (days > 0 && ret != null && benchRet != null) ? ret - benchRet : null
      });
    });
    return { rows: rows, last: last, first: H[0], benchKey: benchKey };
  }

  function perfView(country) {
    var pf = computePerf(country);
    if (!pf || !pf.rows.length) return '<div class="empty">아직 성과 기록이 없습니다.</div>';
    var tracked = pf.rows.filter(function (r) { return r.ret != null; });
    var html = "";

    if (!tracked.length) {
      html += '<div class="theme-desc"><strong>기준점 기록 완료</strong> — ' + esc(pf.first.date) +
        " 기준 " + pf.rows.length + "종목. 다음 자동 갱신부터 수익률이 표시됩니다.</div>";
    } else {
      var avg = tracked.reduce(function (a, r) { return a + r.ret; }, 0) / tracked.length;
      var wins = tracked.filter(function (r) { return r.ret > 0; }).length;
      var alphas = tracked.filter(function (r) { return r.alpha != null; });
      var avgAlpha = alphas.length ? alphas.reduce(function (a, r) { return a + r.alpha; }, 0) / alphas.length : null;
      var tierAvg = {};
      [1, 2, 3].forEach(function (t) {
        var g = tracked.filter(function (r) { return r.tier === t; });
        tierAvg[t] = g.length ? g.reduce(function (a, r) { return a + r.ret; }, 0) / g.length : null;
      });
      html += '<div class="tiles">' +
        pTile("평균 수익률", fmtPct(avg), avg > 0) +
        pTile("승률", Math.round(wins / tracked.length * 100) + "% (" + wins + "/" + tracked.length + ")", wins / tracked.length > 0.5) +
        pTile("시장 대비 초과수익", avgAlpha == null ? "–" : fmtPct(avgAlpha), avgAlpha != null && avgAlpha > 0) +
        pTile("Tier1 / T2 / T3", [1, 2, 3].map(function (t) { return tierAvg[t] == null ? "–" : fmtPct(tierAvg[t]); }).join(" · ")) +
        "</div>";
    }

    var rows = pf.rows.slice().sort(function (a, b) {
      return (b.ret == null ? -1e9 : b.ret) - (a.ret == null ? -1e9 : a.ret);
    }).map(function (r) {
      var thm = themeMeta(r.theme); var tm = tierMeta(r.tier);
      var retCls = r.ret == null ? "" : r.ret >= 0 ? "up" : "down";
      var alCls = r.alpha == null ? "" : r.alpha >= 0 ? "up" : "down";
      // 최신 가격: 한국식 등락색 — 기록시 가격 대비 상승 빨강(▲) / 하락 파랑(▼)
      var pxCls = "", pxArrow = "";
      if (r.basePrice != null && r.lastPrice != null && r.lastPrice !== r.basePrice) {
        var priceUp = r.lastPrice > r.basePrice;
        pxCls = priceUp ? " kr-up" : " kr-down";
        pxArrow = priceUp ? "▲ " : "▼ ";
      }
      return "<tr>" +
        '<td><span class="nm">' + esc(r.name) + '</span><br><span class="tk">' + esc(r.ticker) + "</span></td>" +
        "<td>" + (thm.emoji ? esc(thm.emoji) + " " : "") + esc(thm.label) + "</td>" +
        '<td><span class="mini-dot" style="background:' + tm.color + '"></span>' + r.tier + "</td>" +
        '<td class="num">' + esc(r.since) + "</td>" +
        '<td class="num">' + fmtPrice(r.basePrice, country) + "</td>" +
        '<td class="num' + pxCls + '">' + pxArrow + fmtPrice(r.lastPrice, country) + "</td>" +
        '<td class="num ' + retCls + '">' + (r.ret == null ? "기록 중" : fmtPct(r.ret)) + "</td>" +
        '<td class="num ' + alCls + '">' + (r.alpha == null ? "–" : fmtPct(r.alpha)) + "</td></tr>";
    }).join("");
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      '<th>종목</th><th>주제</th><th>Tier</th><th class="num">첫 기록일</th><th class="num">기록시 가격</th>' +
      '<th class="num">최신 가격</th><th class="num">수익률</th><th class="num">시장 대비</th>' +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
    return html;

    function pTile(k, v, up) {
      return '<div class="tile"><div class="k">' + esc(k) + '</div><div class="v' + (up ? " up" : "") + '">' + v + "</div></div>";
    }
  }

  // 실시간 시세가 도착하면 카드와 Top Picks 를 함께 다시 그려 표시를 일치시킨다.
  // (모두 캐시된 뒤엔 ensureLive 의 todo 가 비어 재귀 호출이 즉시 멈춘다 — 무한 루프 없음)
  function refreshLive() { render(); renderTopPicks(); }

  function render() {
    var host = document.getElementById("cards");
    var descEl = document.getElementById("themeDesc");
    var list;

    if (state.view === "perf") {
      descEl.innerHTML = "<strong>성과 추적</strong> — 추천 시점 대비 실제 수익률 · 기록 " +
        H.length + "일치" + (H.length ? " (" + esc(H[0].date) + " ~ " + esc(H[H.length - 1].date) + ")" : "");
      host.innerHTML = perfView(state.country);
      return;
    }

    var tmeta = themeMeta(state.theme);
    descEl.innerHTML =
      "<strong>" + (tmeta.emoji ? esc(tmeta.emoji) + " " : "") + esc(tmeta.label) + "</strong> — " + esc(tmeta.desc || "");

    list = (D[state.country] || []).filter(function (s) { return s.theme === state.theme; });
    if (!list.length) {
      host.innerHTML = '<div class="empty">해당 주제의 종목이 아직 없습니다.</div>';
      return;
    }

    if (state.view === "table") {
      host.innerHTML = tableView(sortList(list), false);
      ensureLive(list, refreshLive);
      fetchHistory(list, refreshLive);
      return;
    }

    var html = "";
    [1, 2, 3].forEach(function (t) {
      var group = list.filter(function (s) { return s.tier === t; })
                      .sort(function (a, b) { return numOr(b.upside, -Infinity) - numOr(a.upside, -Infinity); });
      if (!group.length) return;
      var tm = tierMeta(t);
      html += '<div class="tier-group"><div class="tier-head">' +
              '<span class="dot" style="background:' + tm.color + '"></span>' + esc(tm.label) +
              ' <span class="tier-n">' + group.length + "종목</span></div>" +
              '<div class="grid">' + group.map(function (s) { return card(s, state.country); }).join("") + "</div></div>";
    });
    host.innerHTML = html;
    ensureLive(list, refreshLive);
    fetchHistory(list, refreshLive);
  }

  document.getElementById("countrySeg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.country = b.dataset.c;
    this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
    renderTopPicks();
    render();
  });
  document.getElementById("themeChips").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.theme = b.dataset.theme;
    this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
    render();
  });
  document.getElementById("viewSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.view = b.dataset.v;
    this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
    render();
  });
  // Top Pick 클릭 → 해당 주제·카드 뷰로 전환하고 그 종목 카드로 스크롤·강조
  document.getElementById("picksGrid").addEventListener("click", function (e) {
    var el = e.target.closest(".pick"); if (!el) return;
    var ticker = el.dataset.ticker, theme = el.dataset.theme;
    if (theme) state.theme = theme;
    state.view = "cards";
    renderThemeChips();
    document.getElementById("viewSeg").querySelectorAll("button").forEach(function (x) {
      x.classList.toggle("on", x.dataset.v === "cards");
    });
    render();
    if (!ticker) return;
    // 렌더 직후 해당 카드로 스크롤 + 잠깐 강조
    requestAnimationFrame(function () {
      var target = null;
      document.querySelectorAll("#cards .card").forEach(function (c) {
        if (c.dataset.ticker === ticker) target = c;
      });
      if (!target) return;
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      target.classList.remove("flash");
      void target.offsetWidth;                 // 애니메이션 재시작
      target.classList.add("flash");
      setTimeout(function () { target.classList.remove("flash"); }, 1800);
    });
  });

  function renderLiquidity() {
    var box = document.getElementById("liqBox");
    // 유효한 게이지 값(단기/중기)이 하나라도 있어야 섹션을 보인다.
    // L 은 있으나 us/korea 키가 없거나 값이 비어도 깨진 빈 게이지가 뜨지 않도록 방어한다.
    function hasTerm(c) { return c && (c.shortTerm != null || c.midTerm != null); }
    if (!L || (!hasTerm(L.us) && !hasTerm(L.korea))) { box.style.display = "none"; return; }
    box.style.display = "";

    var RANKS = ["매우 부정", "부정", "신중", "우호", "매우 우호"];
    var RANK_COLORS = ["var(--down)", "#eb6834", "var(--tier3)", "var(--tier2)", "var(--up)"];

    function gauge(rank) {
      var idx = RANKS.indexOf(rank);
      var cells = RANKS.map(function (_, i) {
        var on = idx >= 0 && i <= idx;
        return '<div class="seg5"' + (on ? ' style="background:' + RANK_COLORS[idx] + '"' : "") + "></div>";
      }).join("");
      return '<div class="gauge">' + cells + "</div>";
    }
    function termRow(label, rank) {
      var idx = RANKS.indexOf(rank);
      var color = idx >= 0 ? RANK_COLORS[idx] : "var(--muted)";
      return '<div class="liq-term"><span class="lbl">' + label + "</span>" +
             gauge(rank) +
             '<span class="rank" style="color:' + color + '">' + esc(rank || "–") + "</span></div>";
    }
    function col(flag, title, c) {
      if (!c) return "";
      var drivers = (c.drivers || []).map(function (d) { return "<li>" + esc(d) + "</li>"; }).join("");
      return '<div class="liq-col"><h3>' + flag + " " + title + "</h3>" +
             termRow("단기 1–3M", c.shortTerm) +
             termRow("중기 6–12M", c.midTerm) +
             (drivers ? '<ul class="liq-drivers">' + drivers + "</ul>" : "") +
             "</div>";
    }

    document.getElementById("liqAs").textContent = "기준일 " + esc(L.asOf);
    document.getElementById("liqHeadline").innerHTML = "<strong>" + esc(L.headline) + "</strong>";
    document.getElementById("liqGrid").innerHTML =
      col("🇺🇸", "미국", L.us) + col("🇰🇷", "한국", L.korea);
    var srcs = (L.sources || []).slice(0, 3).map(function (u, i) {
      return '<a href="' + esc(u) + '" target="_blank" rel="noopener">출처' + (i + 1) + "</a>";
    }).join(" ");
    document.getElementById("liqFoot").innerHTML =
      (L.nextCheck ? '<span class="nc">🔔 다음 체크 — ' + esc(L.nextCheck) + "</span> " : "") + srcs;
  }

  renderLiquidity();
  renderThemeChips();
  renderTopPicks();
  renderRoster();
  render();

  // PWA 서비스워커 등록 (http/https에서만 — file:// 로 열면 건너뜀)
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>

  }

  // 실시간 시세가 도착하면 카드와 Top Picks 를 함께 다시 그려 표시를 일치시킨다.
  // (모두 캐시된 뒤엔 ensureLive 의 todo 가 비어 재귀 호출이 즉시 멈춘다 — 무한 루프 없음)
  function refreshLive() { render(); renderTopPicks(); }

  // ── 정렬 (카드·표 뷰) — 기본: Tier → 상승여력. 필터/정렬 선택 UI는 제거됨. ──
  function sortByKey(list) { return sortList(list.slice()); }

  // ── 관심종목(앱에서 직접 추가/삭제) — 브라우저 localStorage 개인 목록 ──
  //  라이트 카드: 실시간 시세 + 브라우저에서 계산한 단·장기 기술분석만 표시.
  //  (목표가·논거·밸류 등 정밀 분석은 리서치가 필요해 미포함)
  var MYWATCH_KEY = "myWatch.v1";
  var WATCHHIDE_KEY = "watchHidden.v1";   // 편성(theme:"watch") 종목을 이 기기에서 숨김(로컬 삭제)
  var wlCache = {};   // "country:ticker" → undefined(미조회) | "loading" | null(실패) | {price,date,ta,sym}
  function getMyWatch() { try { var v = JSON.parse(localStorage.getItem(MYWATCH_KEY)); return Array.isArray(v) ? v : []; } catch (_e) { return []; } }
  function saveMyWatch(a) { try { localStorage.setItem(MYWATCH_KEY, JSON.stringify(a)); } catch (_e) {} }
  function getWatchHidden() { try { var v = JSON.parse(localStorage.getItem(WATCHHIDE_KEY)); return Array.isArray(v) ? v : []; } catch (_e) { return []; } }
  function saveWatchHidden(a) { try { localStorage.setItem(WATCHHIDE_KEY, JSON.stringify(a)); } catch (_e) {} }
  function isWatchHidden(c, t) { return getWatchHidden().some(function (w) { return w.c === c && w.t === t; }); }
  function isBakedWatch(c, t) { return (D[c] || []).some(function (s) { return s.ticker === t && s.theme === "watch"; }); }
  // 관심종목에서 삭제 — 내가 추가한 종목(localStorage)은 목록에서 제거, 편성 watch 종목은 이 기기에서 숨김.
  function removeFromWatch(c, t) {
    saveMyWatch(getMyWatch().filter(function (w) { return !(w.c === c && w.t === t); }));
    if (isBakedWatch(c, t) && !isWatchHidden(c, t)) { var h = getWatchHidden(); h.push({ c: c, t: t }); saveWatchHidden(h); }
    delete tblExpanded[t];   // 삭제된 종목의 표 펼침 상태가 남아 재등록 시 갑자기 펼쳐지지 않도록 정리
  }

  // 정밀분석 요청 → 다음 정기 분석(매일 08:00 UTC 루틴, PDT 기준 LA 01:00) 반영 시점 안내.
  function nextAnalysisEta() {
    var now = new Date();
    var next = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 8, 0, 0));
    if (next.getTime() <= now.getTime()) next = new Date(next.getTime() + 86400000);
    var hrs = Math.max(1, Math.round((next.getTime() - now.getTime()) / 3600000));
    return "매일 오전 1시(LA) 정기 분석에 반영 · 약 " + hrs + "시간 뒤";
  }

  // ── 정밀분석 요청 상태 — GitHub 이슈('관심종목 정밀분석 요청:')를 읽어 티커별 진행상태 표시 ──
  var wlReqCache = null;   // null=미조회 | { ticker: {state:'open'|'closed', url} }
  var wlReqInflight = false;
  function fetchWatchReqs(onDone) {
    if (wlReqCache || wlReqInflight) return;
    wlReqInflight = true;
    fetch("https://api.github.com/repos/csy870617/stock/issues?state=all&per_page=50&sort=created&direction=desc",
      { headers: { "Accept": "application/vnd.github+json" } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (list) {
        wlReqInflight = false;
        var map = {};
        if (Array.isArray(list)) list.forEach(function (it) {
          if (!it || (it.title || "").indexOf("관심종목 정밀분석 요청") !== 0) return;
          var m = (it.title || "").match(/(\d{6}|[A-Z][A-Z0-9.\-]{0,6})\s+(?:한국|미국)\s*$/);
          if (!m) return;
          var tk = m[1], st = it.state === "closed" ? "closed" : "open";
          // desc 정렬이라 최신이 먼저 — open 이 있으면 open 우선(진행중 표시)
          if (!map[tk] || (st === "open" && map[tk].state !== "open")) map[tk] = { state: st, url: it.html_url };
        });
        wlReqCache = map;
        if (onDone) onDone();
      })
      .catch(function () { wlReqInflight = false; });
  }
  function wlSymbols(code, country) {
    // 정식 편성 경로(symbolFor)와 동일하게 점 포함 미국 티커를 야후 형식으로(BRK.B → BRK-B)
    return country === "us" ? [code.replace(/\./g, "-")] : [code + ".KS", code + ".KQ"];
  }

  // 한 종목의 2년 일봉(종가)+실시간 시세를 시세 Worker 로 받아 브라우저에서 기술분석을 계산
  function fetchWatchOne(item, onDone) {
    var key = item.c + ":" + item.t;
    if (wlCache[key] !== undefined) return;                 // 이미 조회중/완료
    if (!liveSupported || !window.LIB_TA) { wlCache[key] = null; if (onDone) onDone(); return; }
    wlCache[key] = "loading";
    var syms = wlSymbols(item.t, item.c);
    (function tryIdx(i) {
      if (i >= syms.length) { wlCache[key] = null; if (onDone) onDone(); return; }
      var sym = syms[i];
      var hUrl = QUOTES_API + (QUOTES_API.indexOf("?") >= 0 ? "&" : "?") + "history=1&range=" + HIST_RANGE + "&symbols=" + encodeURIComponent(sym);
      var pUrl = QUOTES_API + (QUOTES_API.indexOf("?") >= 0 ? "&" : "?") + "symbols=" + encodeURIComponent(sym);
      Promise.all([
        fetch(hUrl).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
        fetch(pUrl, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
      ]).then(function (res) {
        var hv = res[0] && res[0][sym], pv = res[1] && res[1][sym];
        if (!hv || !Array.isArray(hv.closes) || hv.closes.length < 35) { tryIdx(i + 1); return; }
        var closes = hv.closes, dates = hv.dates || [];
        // Worker history 는 종가만 반환 → high=low=close 로 근사(범위형 오실레이터는 자동 중립 처리)
        var rows = closes.map(function (cl, j) {
          var t = dates[j] ? Math.floor(Date.parse(dates[j] + "T00:00:00Z") / 1000) : j * 86400;
          return { t: t, close: cl, high: cl, low: cl };
        });
        var dp = item.c === "korea" ? 0 : 2;
        var ta = null;
        try { ta = window.LIB_TA.analyzeTimeframes(rows, { dp: dp, srDp: dp }); } catch (_e) { ta = null; }
        var price = pv && typeof pv.price === "number" && isFinite(pv.price) ? pv.price : closes[closes.length - 1];
        var date = pv && pv.date ? pv.date : (dates.length ? dates[dates.length - 1] : "");
        wlCache[key] = { sym: sym, price: price, date: date, ta: ta };
        if (onDone) onDone();
      }).catch(function () { tryIdx(i + 1); });
    })(0);
  }

  // 관심종목 라이트 카드 — 추천 카드와 같은 톤(히어로+기술 신호 박스)이되 시세·기술분석만

    var open = '<article id="' + esc(aid) + '" class="card wl-card">';
    var head = '<div class="head"><h3>' + esc(title) + '<span class="tk">' + esc(item.t) + " · " + (item.c === "us" ? "US" : "KR") + "</span></h3>" +

    // 정밀분석 요청 진행 상태(있으면 표시)
    var req = wlReqCache ? wlReqCache[item.t] : null;

    if (d === undefined || d === "loading") return open + head + reqTag + '<div class="wl-msg">시세 불러오는 중…</div></article>';
    if (d === null) return open + head + reqTag + '<div class="wl-msg">시세를 불러오지 못했습니다 — 코드·시장(한국/미국)을 확인해 주세요.</div></article>';
    var country = item.c;

    var reqTitle = "관심종목 정밀분석 요청: " + (item.n || item.t) + " " + item.t + " " + (country === "us" ? "미국" : "한국");
    var reqBody = "관심종목을 추천 편성과 동일한 정밀 분석(컨센서스 목표가·논거·밸류·배당)으로 만들어 주세요.\n\n" +
      "- 종목명: " + (item.n || "(미입력)") + "\n- 코드: " + item.t + "\n- 시장: " + (country === "us" ? "미국(US)" : "한국(KR)") +
      "\n\n앱의 관심종목 '정밀분석 요청' 버튼으로 생성되었습니다.";
    var reqUrl = "https://github.com/csy870617/stock/issues/new?title=" + encodeURIComponent(reqTitle) + "&body=" + encodeURIComponent(reqBody);
    return open + head +
      '<div class="c-hero"><div class="c-hcell"><div class="c-hv">' + fmtPrice(d.price, country) + '</div>' +
        '<div class="c-hk">' + (chgNum(ta && ta.change) != null ? chgBadge(chgNum(ta.change), "sm") + " " : "") + "현재가 · " + esc(d.date || "실시간") + "</div></div>" +
        (ta && ta.change ? '<div class="c-hcell c-r"><div class="c-hv ' + chDir + '">' + esc(ta.change) + '</div><div class="c-hk">전일대비</div></div>' : "") +
      "</div>" +
      reqTag +
      (req ? "" : '<div class="wl-note">실시간 시세만 보여주는 라이트 카드입니다. 단기/장기 기술 대응·목표가·논거 등 분석은 아래 <b>정밀분석 요청</b>으로 신청하면 풀카드로 승격됩니다. <b>요청 시 매일 오전 1시(LA) 정기 분석에 반영</b>됩니다.</div>') +

           : '<a class="wl-req" href="' + reqUrl + '" target="_blank" rel="noopener">정밀분석 요청 →</a>') + "</div>" +
      "</article>";
  }

  // 관심종목 추가 — 이름/코드 검색 자동완성
  function watchAddForm() {
    return '<form class="wl-add" id="wlAdd" autocomplete="off">' +

        '<input class="wl-in wl-q" id="wlQ" placeholder="종목명 또는 코드로 검색 (예: 삼성전자 · 005930 · Apple)" autocomplete="off" maxlength="30">' +

  // 사전(TICKER_DICT)에서 이름/코드로 후보 검색 (+ 미등록 코드는 직접추가 후보)
  function wlSuggest(q) {
    q = (q || "").trim();
    if (!q) return [];
    var ql = q.toLowerCase(), dict = window.TICKER_DICT || [];
    var res = dict.filter(function (e) { return e.n.toLowerCase().indexOf(ql) >= 0 || e.t.toLowerCase().indexOf(ql) >= 0; });
    res.sort(function (a, b) {
      var ap = a.n.toLowerCase().indexOf(ql) === 0 || a.t.toLowerCase().indexOf(ql) === 0 ? 0 : 1;
      var bp = b.n.toLowerCase().indexOf(ql) === 0 || b.t.toLowerCase().indexOf(ql) === 0 ? 0 : 1;
      return ap - bp || a.n.length - b.n.length;
    });
    res = res.slice(0, 10);
    // 사전에 없는 코드 직접 추가(한국 6자리 / 미국 티커)
    var up = q.toUpperCase(), isKr = /^\d{6}$/.test(q), isUs = /^[A-Z][A-Z0-9.\-]{0,6}$/.test(up);
    if ((isKr || isUs) && !res.some(function (e) { return e.t === (isKr ? q : up) && e.c === (isKr ? "korea" : "us"); })) {
      res.push({ n: "직접 추가", t: isKr ? q : up, c: isKr ? "korea" : "us", raw: true });
    }
    return res;
  }
  function renderWlSug(items) {

  // 관심종목 편입 (중복·가드 확인 후 저장 → 재렌더)
  function wlAddItem(t, n, c) {

    var arr = getMyWatch();

  function render() {

        : "<strong>성과 추적 · 추천시점</strong> — 추천(첫 기록) 시점 대비 실제 수익률을 주제·티어별로 세분화 · 기록 " +
          H.length + "일치" + (H.length ? " (" + esc(H[0].date) + " ~ " + esc(H[H.length - 1].date) + ")" : "");

    if (state.theme === "watch") {
      var country = state.country;

      // ① 편성 watch 종목(에스원·JYP 등) — 단, 이 기기에서 숨긴(삭제한) 종목은 제외
      var fullStocks = list.filter(function (s) { return !isWatchHidden(country, s.ticker); });
      var shown = {}; fullStocks.forEach(function (s) { shown[s.ticker] = 1; });
      // ② 사용자가 등록한 종목: 추천 편성에 있으면 그 풀카드, 없으면 라이트 카드

        else mineLight.push(w);                        // 그 외 → 라이트 카드
      });
      fullStocks.sort(function (a, b) { return numOr(effective(b).upside, -Infinity) - numOr(effective(a).upside, -Infinity); });

    if (!T || !Array.isArray(T.indices) || !T.indices.length) { box.style.display = "none"; return; }
    box.style.display = "";

    var NT = (window.INDEX_NOTES && window.INDEX_NOTES.items) || {};
    // 지수↔지역 유동성 매핑 + 게이지 색
    var IDX_REGION = { nasdaq: "us", dow: "us", kospi: "korea", kosdaq: "korea" };
    var LIQ_COL = { "매우 우호": "var(--up)", "우호": "var(--tier2)", "신중": "var(--tier3)", "부정": "#eb6834", "매우 부정": "var(--down)" };
    function idxLiqGrade(key) {
      var r = IDX_REGION[key]; if (!r) return "";
      var L = window.LIQUIDITY_DATA, A = window.LIQUIDITY_AUTO, c = (L && L[r]) || (A && A[r]);
      return (c && c.shortTerm) || "";
    }
    // 지수 카드 — 이름·기준일 / 지수값·등락 / 밸류(유동성 포함) + 단·장기 대응. 탭 시 네이버 차트.
    function noteLine(k, v, lead) {
      return v ? '<div class="tn-line"><span class="tn-k">' + k + '</span><span class="tn-v">' + (lead || "") + esc(v) + "</span></div>" : "";
    }
    function tile(x) {
      var chDir = x.changeDir === "up" ? "up" : "down";
      var n = NT[x.key];
      var g = idxLiqGrade(x.key);
      var liqChip = g ? '<span class="it-liq" style="color:' + (LIQ_COL[g] || "var(--muted)") + '">유동성 ' + esc(g) + "</span>" : "";
      function sigBadge(gr) { return gr ? '<span class="tn-sig" style="background:' + (TA_SIG_COL[gr] || "var(--muted)") + '">' + esc(gr) + "</span>" : ""; }
      var nnAsOf = window.INDEX_NOTES && window.INDEX_NOTES.asOf;
      var stale = nnAsOf && T.asOf && nnAsOf < T.asOf;
      var staleBadge = stale ? '<span class="tn-stale" title="오늘 데이터(' + esc(T.asOf) + ')로 아직 갱신되지 않았습니다. 표시는 ' + esc(nnAsOf) + ' 기준입니다.">⚠ 미갱신</span>' : "";
      var body = (n && (n.value || n.short || n.long))
        ? '<div class="it-note">' + noteLine("밸류", n.value, liqChip) + noteLine("단기", n.short, sigBadge(n.sigShort)) + noteLine("장기", n.long, sigBadge(n.sigLong)) + "</div>" : "";
      var inner =
        '<div class="it-top"><span class="it-nm">' + esc(x.name) + "</span>" +
          (x.period ? '<span class="it-pd">' + esc(x.period) + "</span>" : "") + staleBadge + "</div>" +
        '<div class="it-px"><span class="it-lv">' + esc(x.level) + "</span>" +
          '<span class="it-ch ' + chDir + '">' + esc(x.change) + "</span></div>" + body;
      var cls = "idx-tile" + (stale ? " stale" : "");
      return x.chartUrl
        ? '<a class="' + cls + '" href="' + esc(x.chartUrl) + '" target="_blank" rel="noopener">' + inner + "</a>"
        : '<div class="' + cls + '">' + inner + "</div>";
    }

    var NN = window.INDEX_NOTES;
    document.getElementById("idxAs").textContent = "기준일 " + esc(T.asOf) +
      (NN && NN.asOf && NN.asOf !== T.asOf ? " · 대응 " + esc(NN.asOf) : "");
    // 선택된 국가의 지수만 표시(미국=나스닥·다우, 한국=코스피·코스닥)
    var shown = T.indices.filter(function (x) { return IDX_REGION[x.key] === state.country; });
    if (!shown.length) shown = T.indices;   // 매핑 밖이면 전체 폴백
    document.getElementById("idxGrid").innerHTML = shown.map(tile).join("");
  }

  renderLiquidity();
  renderIndexTA();
  state.theme = themeKeysOrdered()[0] || state.theme;   // 초기 선택 = 사용자가 정한 맨 앞 주제
  renderThemeChips();
  renderTopPicks();
  renderRoster();
  render();

  // PWA 서비스워커 등록 (http/https에서만 — file:// 로 열면 건너뜀)
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>

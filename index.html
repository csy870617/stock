<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주식 분석 · 종목 추천</title>
<style>
:root {
  --page:            #f9f9f7;
  --surface:         #fcfcfb;
  --ink:             #0b0b0b;
  --ink-2:           #52514e;
  --muted:           #898781;
  --grid:            #e1e0d9;
  --border:          rgba(11,11,11,0.10);
  --tier1:           #2a78d6;
  --tier2:           #1baf7a;
  --tier3:           #eda100;
  --up:              #006300;
  --down:            #d03b3b;
  --meter-track:     #f0efec;
  --meter-lo:        #86b6ef;
  --meter-hi:        #1c5cab;
  --chip-bg:         #f0efec;
}
:root[data-theme="dark"] {
  --page:            #0d0d0d;
  --surface:         #1a1a19;
  --ink:             #ffffff;
  --ink-2:           #c3c2b7;
  --muted:           #898781;
  --grid:            #2c2c2a;
  --border:          rgba(255,255,255,0.10);
  --tier1:           #3987e5;
  --tier2:           #199e70;
  --tier3:           #c98500;
  --up:              #0ca30c;
  --down:            #e66767;
  --meter-track:     #383835;
  --meter-lo:        #86b6ef;
  --meter-hi:        #3987e5;
  --chip-bg:         #2c2c2a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page:            #0d0d0d;
    --surface:         #1a1a19;
    --ink:             #ffffff;
    --ink-2:           #c3c2b7;
    --muted:           #898781;
    --grid:            #2c2c2a;
    --border:          rgba(255,255,255,0.10);
    --tier1:           #3987e5;
    --tier2:           #199e70;
    --tier3:           #c98500;
    --up:              #0ca30c;
    --down:            #e66767;
    --meter-track:     #383835;
    --meter-lo:        #86b6ef;
    --meter-hi:        #3987e5;
    --chip-bg:         #2c2c2a;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height: 1.55;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 64px; }

header.site { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
header.site h1 { font-size: 1.45rem; font-weight: 700; }
.gen-date { color: var(--ink-2); font-size: 0.85rem; }
.theme-btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  border-radius: 8px; padding: 4px 10px; font-size: 0.8rem; cursor: pointer;
}
.market-note {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 16px; margin: 14px 0 20px; color: var(--ink-2); font-size: 0.92rem;
}
.market-note strong { color: var(--ink); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 24px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.tile .k { color: var(--muted); font-size: 0.78rem; margin-bottom: 2px; }
.tile .v { font-size: 1.35rem; font-weight: 700; }
.tile .v.up { color: var(--up); }

.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.seg button {
  border: 0; background: var(--surface); color: var(--ink-2); padding: 7px 16px;
  font-size: 0.9rem; cursor: pointer;
}
.seg button.on { background: var(--chip-bg); color: var(--ink); font-weight: 700; }
.chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 5px 12px; font-size: 0.82rem; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.chip.on { background: var(--chip-bg); color: var(--ink); font-weight: 700; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;
}
.card .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card h3 { font-size: 1.06rem; }
.card .tk { color: var(--muted); font-size: 0.78rem; font-weight: 400; margin-left: 4px; }
.badge {
  font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  background: var(--chip-bg); color: var(--ink-2);
}
.badge .dot { width: 8px; height: 8px; border-radius: 50%; }

.prices { display: flex; gap: 18px; flex-wrap: wrap; }
.pv .k { color: var(--muted); font-size: 0.72rem; }
.pv .v { font-size: 1.02rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.pv .v.up { color: var(--up); }
.pv .v.down { color: var(--down); }

.meter { height: 6px; border-radius: 4px; background: var(--meter-track); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--meter-lo), var(--meter-hi)); }
.meter-row { display: flex; align-items: center; gap: 10px; }
.meter-row .meter { flex: 1; }
.meter-row .pct { font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 58px; text-align: right; }
.meter-row .pct.up { color: var(--up); }
.meter-row .pct.down { color: var(--down); }

.earn { color: var(--ink-2); font-size: 0.84rem; border-left: 3px solid var(--grid); padding-left: 10px; }
.thesis { font-size: 0.9rem; }
.risks { color: var(--ink-2); font-size: 0.84rem; }
.risks b { color: var(--ink); font-weight: 600; }
.links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
.links a { color: var(--tier1); font-size: 0.84rem; text-decoration: none; }
.links a:hover { text-decoration: underline; }
.src { color: var(--muted); font-size: 0.75rem; }
.src a { color: var(--muted); }

.section-title { font-size: 1.1rem; font-weight: 700; margin: 26px 0 12px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }

footer.site {
  margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--grid);
  color: var(--muted); font-size: 0.8rem;
}
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1>📈 주식 분석 · 종목 추천</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="gen-date" id="genDate"></span>
      <button class="theme-btn" id="themeBtn" type="button">🌓 테마</button>
    </div>
  </header>

  <div class="market-note" id="marketNote"></div>

  <div class="tiles" id="tiles"></div>

  <div class="controls">
    <div class="seg" id="countrySeg">
      <button data-c="korea" class="on" type="button">🇰🇷 한국</button>
      <button data-c="us" type="button">🇺🇸 미국</button>
    </div>
    <div class="chips" id="tierChips">
      <button class="chip on" data-t="all" type="button">전체</button>
      <button class="chip" data-t="1" type="button"><span class="dot" style="background:var(--tier1)"></span>Tier 1 · 핵심</button>
      <button class="chip" data-t="2" type="button"><span class="dot" style="background:var(--tier2)"></span>Tier 2 · 성장·균형</button>
      <button class="chip" data-t="3" type="button"><span class="dot" style="background:var(--tier3)"></span>Tier 3 · 저평가·기회</button>
    </div>
  </div>

  <div class="grid" id="cards"></div>

  <footer class="site">
    <p id="disclaimer"></p>
    <p style="margin-top:6px;">데이터는 stock-recommender 스킬 분석 결과이며, 갱신 방법은 저장소 README를 참고하세요.</p>
  </footer>
</div>

<script src="data/recommendations.js"></script>
<script>
(function () {
  var D = window.STOCK_DATA;
  var state = { country: "korea", tier: "all" };

  var root = document.documentElement;
  document.getElementById("themeBtn").addEventListener("click", function () {
    var cur = root.getAttribute("data-theme");
    var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    var effective = cur || (prefersDark ? "dark" : "light");
    root.setAttribute("data-theme", effective === "dark" ? "light" : "dark");
  });

  if (!D) {
    document.getElementById("cards").innerHTML =
      '<div class="empty">data/recommendations.js 를 불러오지 못했습니다.</div>';
    return;
  }

  document.getElementById("genDate").textContent = "분석 기준일 " + D.generatedAt;
  document.getElementById("marketNote").innerHTML =
    "<strong>시장 코멘트</strong> — " + esc(D.marketNote);
  document.getElementById("disclaimer").textContent = D.disclaimer;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function fmtPrice(v, country) {
    if (v == null) return "–";
    return country === "korea"
      ? "₩" + Math.round(v).toLocaleString("ko-KR")
      : "$" + Number(v).toLocaleString("en-US", { maximumFractionDigits: 2 });
  }
  function fmtPct(v) {
    if (v == null) return "–";
    return (v > 0 ? "+" : "") + Number(v).toFixed(1) + "%";
  }
  function tierMeta(t) {
    return {
      1: { label: "Tier 1 · 핵심", color: "var(--tier1)" },
      2: { label: "Tier 2 · 성장·균형", color: "var(--tier2)" },
      3: { label: "Tier 3 · 저평가·기회", color: "var(--tier3)" }
    }[t] || { label: "Tier ?", color: "var(--muted)" };
  }

  function renderTiles() {
    var all = (D.korea || []).concat(D.us || []);
    var ups = all.map(function (s) { return s.upside; }).filter(function (v) { return v != null; });
    var avg = ups.length ? ups.reduce(function (a, b) { return a + b; }, 0) / ups.length : null;
    var best = all.filter(function (s) { return s.upside != null; })
                  .sort(function (a, b) { return b.upside - a.upside; })[0];
    var t1 = all.filter(function (s) { return s.tier === 1; }).length;
    document.getElementById("tiles").innerHTML =
      tile("추천 종목", all.length + "종목") +
      tile("평균 상승여력", avg == null ? "–" : fmtPct(avg), avg != null && avg > 0) +
      tile("최대 상승여력", best ? best.name + " " + fmtPct(best.upside) : "–", true) +
      tile("Tier 1 핵심 종목", t1 + "종목");
    function tile(k, v, up) {
      return '<div class="tile"><div class="k">' + esc(k) + '</div><div class="v' +
             (up ? " up" : "") + '">' + esc(v) + "</div></div>";
    }
  }

  function card(s, country) {
    var tm = tierMeta(s.tier);
    var upCls = s.upside == null ? "" : s.upside >= 0 ? "up" : "down";
    var meterW = s.upside == null ? 0 : Math.max(0, Math.min(100, s.upside * 2));
    var risks = (s.risks || []).map(esc).join(" · ");
    var srcs = (s.sources || []).slice(0, 3).map(function (u, i) {
      return '<a href="' + esc(u) + '" target="_blank" rel="noopener">출처' + (i + 1) + "</a>";
    }).join(" ");
    return '<article class="card">' +
      '<div class="head"><h3>' + esc(s.name) + '<span class="tk">' + esc(s.ticker) + " · " + esc(s.market) + "</span></h3>" +
      '<span class="badge"><span class="dot" style="background:' + tm.color + '"></span>' + tm.label + "</span></div>" +
      '<div class="prices">' +
        '<div class="pv"><div class="k">현재가 (' + esc(s.priceDate || D.generatedAt) + ')</div><div class="v">' + fmtPrice(s.price, country) + "</div></div>" +
        '<div class="pv"><div class="k">목표가 (컨센서스)</div><div class="v">' + fmtPrice(s.targetPrice, country) + "</div></div>" +
        '<div class="pv"><div class="k">배당수익률</div><div class="v">' + (s.dividendYield == null ? "–" : Number(s.dividendYield).toFixed(1) + "%") + "</div></div>" +
      "</div>" +
      '<div class="meter-row"><div class="meter"><i style="width:' + meterW + '%"></i></div>' +
      '<div class="pct ' + upCls + '">' + fmtPct(s.upside) + "</div></div>" +
      (s.earnings ? '<div class="earn">' + esc(s.earnings) + "</div>" : "") +
      '<div class="thesis">' + esc(s.thesis) + "</div>" +
      (risks ? '<div class="risks"><b>리스크</b> — ' + risks + "</div>" : "") +
      '<div class="links"><a href="' + esc(s.chartUrl) + '" target="_blank" rel="noopener">📊 네이버 차트 보기</a>' +
      '<span class="src">' + srcs + "</span></div>" +
      "</article>";
  }

  function render() {
    var list = (D[state.country] || []).slice();
    if (state.tier !== "all") {
      list = list.filter(function (s) { return String(s.tier) === state.tier; });
    }
    list.sort(function (a, b) {
      return (a.tier - b.tier) || ((b.upside || -999) - (a.upside || -999));
    });
    document.getElementById("cards").innerHTML = list.length
      ? list.map(function (s) { return card(s, state.country); }).join("")
      : '<div class="empty">해당 조건의 종목이 없습니다.</div>';
  }

  document.getElementById("countrySeg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.country = b.dataset.c;
    this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
    render();
  });
  document.getElementById("tierChips").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.tier = b.dataset.t;
    this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
    render();
  });

  renderTiles();
  render();
})();
</script>
</body>
</html>
